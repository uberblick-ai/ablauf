<svg xmlns="http://www.w3.org/2000/svg" class="ab ab-dark" viewBox="0 0 678 680" width="678" height="680" role="img" aria-label="Sequence: Creator, Studio, Backend, Owner's inbox. Creator to Studio: Claim existing show. Studio to Backend: POST claim for show. Backend to Owner's inbox: Send 6-digit code. Creator to Studio: Enter code. Studio to Backend: POST verify code. Backend to Creator: The show is yours. Backend to Creator: Try again or resend the code">
<style>.ab.ab-dark{--bg:var(--ab-bg,#171c24);--ink:var(--ab-ink,#e5e9ef);--muted:var(--ab-muted,#98a2b0);--line:var(--ab-line,#2c3440);--band:var(--ab-band,#151b23);--surface:var(--ab-surface,#1d232d);--neutral:var(--ab-neutral,#b6bbc3);--neutral-bg:var(--ab-neutral-bg,#303640);--agent:var(--ab-agent,#85aaa5);--agent-bg:var(--ab-agent-bg,#232d2b);--system:var(--ab-system,#98a5bf);--system-bg:var(--ab-system-bg,#262a31);--rework:var(--ab-rework,#b29d87);--rework-bg:var(--ab-rework-bg,#2c2720);--stop:var(--ab-stop,#ac8c88);--stop-bg:var(--ab-stop-bg,#2b2221);--done:var(--ab-done,#95b09c);--done-bg:var(--ab-done-bg,#222a24);}
.ab text{font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;fill:var(--ink)}
.ab .m{font-family:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace}
.ab .s11{font-size:11px}.ab .s12{font-size:12px}.ab .s13{font-size:13px}
.ab .muted{fill:var(--muted)}.ab .b{font-weight:600}
.ab .cap{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;font-size:11px;letter-spacing:.08em;fill:var(--muted)}
.ab .band{fill:var(--band)}.ab .rule{stroke:var(--line);stroke-width:1.2;stroke-dasharray:3 5}
.ab .pill{fill:var(--surface);stroke:var(--line);stroke-width:1.2}
.ab .e{fill:none;stroke-width:1.6}.ab .dash{stroke-dasharray:6 5}
.ab .knockout{fill:none;stroke:var(--bg);stroke-width:5.6}.ab .knockout-band{stroke:var(--band)}
.ab .arrow{fill:none;stroke:none}
.ab .t-ink{fill:var(--muted)}.ab .e-ink{stroke:var(--muted)}.ab .k-ink{fill:var(--surface);stroke:var(--line);stroke-width:1.5}.ab .t-muted{fill:var(--muted)}.ab .e-muted{stroke:var(--muted)}.ab .k-muted{fill:var(--surface);stroke:var(--line);stroke-width:1.5}.ab .t-neutral{fill:var(--neutral)}.ab .e-neutral{stroke:var(--neutral)}.ab .k-neutral{fill:var(--neutral-bg);stroke:var(--neutral);stroke-width:1.5}.ab .t-agent{fill:var(--agent)}.ab .e-agent{stroke:var(--agent)}.ab .k-agent{fill:var(--agent-bg);stroke:var(--agent);stroke-width:1.5}.ab .t-system{fill:var(--system)}.ab .e-system{stroke:var(--system)}.ab .k-system{fill:var(--system-bg);stroke:var(--system);stroke-width:1.5}.ab .t-done{fill:var(--done)}.ab .e-done{stroke:var(--done)}.ab .k-done{fill:var(--done-bg);stroke:var(--done);stroke-width:1.5}.ab .t-rework{fill:var(--rework)}.ab .e-rework{stroke:var(--rework)}.ab .k-rework{fill:var(--rework-bg);stroke:var(--rework);stroke-width:1.5}.ab .t-stop{fill:var(--stop)}.ab .e-stop{stroke:var(--stop)}.ab .k-stop{fill:var(--stop-bg);stroke:var(--stop);stroke-width:1.5}
.ab .k-stop.panel{stroke-width:1.2;stroke-dasharray:5 4}
.ab .seq-lane{fill:var(--neutral-bg)}.ab .seq-life{stroke:var(--line);stroke-width:1;stroke-opacity:.5}.ab .seq-response{stroke-width:1.2}.ab .seq-group{fill:var(--neutral-bg)}.ab .seq-kind{fill:var(--ink)}.ab .seq-note{fill:var(--rework-bg)}.ab .seq-note-text{fill:var(--rework)}.ab .seq-divider{stroke:var(--line);stroke-width:1;stroke-dasharray:2 4}.ab .seq-rule{stroke:var(--line);stroke-width:1}</style>
<defs><marker id="claim-short-seq-ink" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" class="t-ink"/></marker>
<marker id="claim-short-seq-system" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" class="t-system"/></marker>
<marker id="claim-short-seq-response" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10" class="e e-muted seq-response"/></marker></defs>
<rect x="186" y="8" width="164" height="664" rx="8" class="seq-lane" fill-opacity="0.15"/>
<rect x="514" y="8" width="164" height="664" rx="8" class="seq-lane" fill-opacity="0.15"/>
<rect x="24" y="468" width="488" height="192" rx="8" class="seq-group" fill-opacity="0.5"/>
<line x1="104" y1="46" x2="104" y2="672" class="seq-life"/>
<line x1="268" y1="46" x2="268" y2="672" class="seq-life"/>
<line x1="432" y1="46" x2="432" y2="672" class="seq-life"/>
<line x1="596" y1="46" x2="596" y2="672" class="seq-life"/>
<g data-line="2">
<circle cx="104" cy="20" r="3" class="t-ink"/>
<text x="104" y="40" text-anchor="middle" class="m s12 b t-ink seq-title">Creator</text>
</g>
<g data-line="3">
<circle cx="268" cy="20" r="3" class="t-system"/>
<text x="268" y="40" text-anchor="middle" class="m s12 b t-system seq-title">Studio</text>
</g>
<g data-line="4">
<circle cx="432" cy="20" r="3" class="t-system"/>
<text x="432" y="40" text-anchor="middle" class="m s12 b t-system seq-title">Backend</text>
</g>
<g data-line="5">
<circle cx="596" cy="20" r="3" class="t-ink"/>
<text x="596" y="40" text-anchor="middle" class="m s12 b t-ink seq-title">Owner's inbox</text>
</g>
<g data-line="7" data-annotation="section">
<text x="30" y="70" class="m s11 muted seq-section">CLAIM</text>
<line x1="75" y1="66" x2="670" y2="66" class="seq-rule"/>
</g>
<g data-line="8" data-step="1">
<text x="112" y="108" class="m s12 seq-label">Claim existing show</text>
<text x="0" y="126" class="m s11 muted seq-number">01</text>
<path d="M104,122 L268,122" class="e e-ink" marker-end="url(#claim-short-seq-ink)"/>
<circle cx="104" cy="122" r="2.5" class="t-ink"/>
</g>
<g data-line="9" data-step="2">
<text x="276" y="160" class="m s12 seq-label">POST claim for show</text>
<text x="0" y="178" class="m s11 muted seq-number">02</text>
<path d="M268,174 L432,174" class="e e-system" marker-end="url(#claim-short-seq-system)"/>
<circle cx="268" cy="174" r="2.5" class="t-system"/>
</g>
<g data-line="10" data-step="3">
<text x="440" y="212" class="m s12 seq-label">Send 6-digit code</text>
<text x="0" y="230" class="m s11 muted seq-number">03</text>
<path d="M432,226 L596,226" class="e e-system" marker-end="url(#claim-short-seq-system)"/>
<circle cx="432" cy="226" r="2.5" class="t-system"/>
</g>
<g data-line="11" data-annotation="note">
<rect x="322" y="252" width="220" height="54" rx="6" class="seq-note"/>
<rect x="322" y="257" width="3" height="44" rx="1.5" class="t-rework"/>
<text x="334" y="271" class="m s12 seq-note-text">The code expires after 15</text>
<text x="334" y="289" class="m s12 seq-note-text">minutes</text>
</g>
<g data-line="12" data-annotation="section">
<text x="30" y="338" class="m s11 muted seq-section">VERIFY</text>
<line x1="81.6" y1="334" x2="670" y2="334" class="seq-rule"/>
</g>
<g data-line="13" data-step="4">
<text x="112" y="376" class="m s12 seq-label">Enter code</text>
<text x="0" y="394" class="m s11 muted seq-number">04</text>
<path d="M104,390 L268,390" class="e e-ink" marker-end="url(#claim-short-seq-ink)"/>
<circle cx="104" cy="390" r="2.5" class="t-ink"/>
</g>
<g data-line="14" data-step="5">
<text x="276" y="428" class="m s12 seq-label">POST verify code</text>
<text x="0" y="446" class="m s11 muted seq-number">05</text>
<path d="M268,442 L432,442" class="e e-system" marker-end="url(#claim-short-seq-system)"/>
<circle cx="268" cy="442" r="2.5" class="t-system"/>
</g>
<g data-line="15" data-annotation="open">
<text x="34" y="482" class="m s11 b seq-kind">ALT</text>
<text x="65.8" y="482" class="m s11 muted seq-group-label">CODE MATCHES</text>
</g>
<g data-line="16" data-step="6">
<text x="112" y="520" class="m s12 seq-label">The show is yours</text>
<text x="0" y="538" class="m s11 muted seq-number">06</text>
<path d="M432,534 L104,534" class="e e-muted dash seq-response" marker-end="url(#claim-short-seq-response)"/>
</g>
<line x1="32" y1="560" x2="504" y2="560" class="seq-divider"/>
<g data-line="17" data-annotation="else">
<text x="34" y="582" class="m s11 b seq-kind">ELSE</text>
<text x="72.4" y="582" class="m s11 muted seq-else-label">WRONG OR EXPIRED CODE</text>
</g>
<g data-line="18" data-step="7">
<text x="112" y="620" class="m s12 seq-label">Try again or resend the code</text>
<text x="0" y="638" class="m s11 muted seq-number">07</text>
<path d="M432,634 L104,634" class="e e-muted dash seq-response" marker-end="url(#claim-short-seq-response)"/>
</g>
</svg>
