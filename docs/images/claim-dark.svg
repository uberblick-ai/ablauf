<svg xmlns="http://www.w3.org/2000/svg" class="ab ab-dark" viewBox="0 0 678 1118" width="678" height="1118" role="img" aria-label="Sequence: Creator, Studio, Backend, RSS feed, Owner's inbox. Creator to Studio: Sign in, no show yet. Studio to Creator: Claim existing, Add via RSS, Start from scratch. Creator to Studio: Claim existing show. Studio to Backend: POST claim for show. Backend to RSS feed: Fetch feed live. RSS feed to Backend: itunes owner email. Backend to Owner's inbox: Send 6-digit code. Owner's inbox to Creator: Email with the code. Creator to Studio: Enter code. Studio to Backend: POST verify code. Backend to Backend: Check code and expiry. Backend to Studio: Claim confirmed. Studio to Creator: The show is yours. Backend to Studio: Rejected, attempts left. Studio to Creator: Try again or resend the code">
<style>.ab.ab-dark{--bg:var(--ab-bg,#171c24);--ink:var(--ab-ink,#e5e9ef);--muted:var(--ab-muted,#98a2b0);--line:var(--ab-line,#2c3440);--band:var(--ab-band,#151b23);--surface:var(--ab-surface,#1d232d);--neutral:var(--ab-neutral,#b6bbc3);--neutral-bg:var(--ab-neutral-bg,#303640);--agent:var(--ab-agent,#85aaa5);--agent-bg:var(--ab-agent-bg,#232d2b);--system:var(--ab-system,#98a5bf);--system-bg:var(--ab-system-bg,#262a31);--rework:var(--ab-rework,#b29d87);--rework-bg:var(--ab-rework-bg,#2c2720);--stop:var(--ab-stop,#ac8c88);--stop-bg:var(--ab-stop-bg,#2b2221);--done:var(--ab-done,#95b09c);--done-bg:var(--ab-done-bg,#222a24);}
.ab text{font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;fill:var(--ink)}
.ab .m{font-family:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace}
.ab .s11{font-size:11px}.ab .s12{font-size:12px}.ab .s13{font-size:13px}
.ab .muted{fill:var(--muted)}.ab .b{font-weight:600}
.ab .cap{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;font-size:11px;letter-spacing:.08em;fill:var(--muted)}
.ab .band{fill:var(--band)}.ab .rule{stroke:var(--line);stroke-width:1.2;stroke-dasharray:3 5}
.ab .pill{fill:var(--surface);stroke:var(--line);stroke-width:1.2}
.ab .e{fill:none;stroke-width:1.6}.ab .dash{stroke-dasharray:6 5}
.ab .knockout{fill:none;stroke:var(--bg);stroke-width:5.6}.ab .knockout-band{stroke:var(--band)}
.ab .arrow{fill:none;stroke:none}
.ab .t-ink{fill:var(--muted)}.ab .e-ink{stroke:var(--muted)}.ab .k-ink{fill:var(--surface);stroke:var(--line);stroke-width:1.5}.ab .t-muted{fill:var(--muted)}.ab .e-muted{stroke:var(--muted)}.ab .k-muted{fill:var(--surface);stroke:var(--line);stroke-width:1.5}.ab .t-neutral{fill:var(--neutral)}.ab .e-neutral{stroke:var(--neutral)}.ab .k-neutral{fill:var(--neutral-bg);stroke:var(--neutral);stroke-width:1.5}.ab .t-agent{fill:var(--agent)}.ab .e-agent{stroke:var(--agent)}.ab .k-agent{fill:var(--agent-bg);stroke:var(--agent);stroke-width:1.5}.ab .t-system{fill:var(--system)}.ab .e-system{stroke:var(--system)}.ab .k-system{fill:var(--system-bg);stroke:var(--system);stroke-width:1.5}.ab .t-done{fill:var(--done)}.ab .e-done{stroke:var(--done)}.ab .k-done{fill:var(--done-bg);stroke:var(--done);stroke-width:1.5}.ab .t-rework{fill:var(--rework)}.ab .e-rework{stroke:var(--rework)}.ab .k-rework{fill:var(--rework-bg);stroke:var(--rework);stroke-width:1.5}.ab .t-stop{fill:var(--stop)}.ab .e-stop{stroke:var(--stop)}.ab .k-stop{fill:var(--stop-bg);stroke:var(--stop);stroke-width:1.5}
.ab .k-stop.panel{stroke-width:1.2;stroke-dasharray:5 4}
.ab .seq-lane{fill:var(--neutral-bg)}.ab .seq-life{stroke:var(--line);stroke-width:1;stroke-opacity:.5}.ab .seq-response{stroke-width:1.2}.ab .seq-group{fill:var(--neutral-bg)}.ab .seq-kind{fill:var(--ink)}.ab .seq-note{fill:var(--rework-bg)}.ab .seq-note-text{fill:var(--rework)}.ab .seq-divider{stroke:var(--line);stroke-width:1;stroke-dasharray:2 4}.ab .seq-rule{stroke:var(--line);stroke-width:1}</style>
<defs><marker id="claim-seq-ink" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" class="t-ink"/></marker>
<marker id="claim-seq-system" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" class="t-system"/></marker>
<marker id="claim-seq-response" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10" class="e e-muted seq-response"/></marker></defs>
<rect x="153.2" y="8" width="131.2" height="1102" rx="8" class="seq-lane" fill-opacity="0.15"/>
<rect x="415.59999999999997" y="8" width="131.2" height="1102" rx="8" class="seq-lane" fill-opacity="0.15"/>
<rect x="24" y="802" width="389.59999999999997" height="296" rx="8" class="seq-group" fill-opacity="0.5"/>
<line x1="88" y1="46" x2="88" y2="1110" class="seq-life"/>
<line x1="219" y1="46" x2="219" y2="1110" class="seq-life"/>
<line x1="350" y1="46" x2="350" y2="1110" class="seq-life"/>
<line x1="481" y1="46" x2="481" y2="1110" class="seq-life"/>
<line x1="612" y1="46" x2="612" y2="1110" class="seq-life"/>
<g data-line="2">
<circle cx="88" cy="20" r="3" class="t-ink"/>
<text x="88" y="40" text-anchor="middle" class="m s12 b t-ink seq-title">Creator</text>
</g>
<g data-line="3">
<circle cx="219" cy="20" r="3" class="t-system"/>
<text x="219" y="40" text-anchor="middle" class="m s12 b t-system seq-title">Studio</text>
</g>
<g data-line="4">
<circle cx="350" cy="20" r="3" class="t-system"/>
<text x="350" y="40" text-anchor="middle" class="m s12 b t-system seq-title">Backend</text>
</g>
<g data-line="5">
<circle cx="481" cy="20" r="3" class="t-system"/>
<text x="481" y="40" text-anchor="middle" class="m s12 b t-system seq-title">RSS feed</text>
</g>
<g data-line="6">
<circle cx="612" cy="20" r="3" class="t-ink"/>
<text x="612" y="40" text-anchor="middle" class="m s12 b t-ink seq-title">Owner's inbox</text>
</g>
<g data-line="8" data-annotation="section">
<text x="30" y="70" class="m s11 muted seq-section">CLAIM</text>
<line x1="75" y1="66" x2="670" y2="66" class="seq-rule"/>
</g>
<g data-line="9" data-step="1">
<text x="96" y="108" class="m s12 seq-label">Sign in, no show yet</text>
<text x="0" y="126" class="m s11 muted seq-number">01</text>
<path d="M88,122 L219,122" class="e e-ink" marker-end="url(#claim-seq-ink)"/>
<circle cx="88" cy="122" r="2.5" class="t-ink"/>
</g>
<g data-line="10" data-step="2">
<text x="96" y="160" class="m s12 seq-label">Claim existing, Add via RSS, Start from scratch</text>
<text x="0" y="178" class="m s11 muted seq-number">02</text>
<path d="M219,174 L88,174" class="e e-muted dash seq-response" marker-end="url(#claim-seq-response)"/>
</g>
<g data-line="11" data-step="3">
<text x="96" y="212" class="m s12 seq-label">Claim existing show</text>
<text x="0" y="230" class="m s11 muted seq-number">03</text>
<path d="M88,226 L219,226" class="e e-ink" marker-end="url(#claim-seq-ink)"/>
<circle cx="88" cy="226" r="2.5" class="t-ink"/>
</g>
<g data-line="12" data-step="4">
<text x="227" y="264" class="m s12 seq-label">POST claim for show</text>
<text x="0" y="282" class="m s11 muted seq-number">04</text>
<path d="M219,278 L350,278" class="e e-system" marker-end="url(#claim-seq-system)"/>
<circle cx="219" cy="278" r="2.5" class="t-system"/>
</g>
<g data-line="13" data-step="5">
<text x="358" y="316" class="m s12 seq-label">Fetch feed live</text>
<text x="0" y="334" class="m s11 muted seq-number">05</text>
<path d="M350,330 L481,330" class="e e-system" marker-end="url(#claim-seq-system)"/>
<circle cx="350" cy="330" r="2.5" class="t-system"/>
</g>
<g data-line="14" data-step="6">
<text x="358" y="368" class="m s12 seq-label">itunes owner email</text>
<text x="0" y="386" class="m s11 muted seq-number">06</text>
<path d="M481,382 L350,382" class="e e-muted dash seq-response" marker-end="url(#claim-seq-response)"/>
</g>
<g data-line="16" data-step="7">
<text x="358" y="420" class="m s12 seq-label">Send 6-digit code</text>
<text x="0" y="438" class="m s11 muted seq-number">07</text>
<path d="M350,434 L612,434" class="e e-system" marker-end="url(#claim-seq-system)"/>
<circle cx="350" cy="434" r="2.5" class="t-system"/>
</g>
<g data-line="17" data-annotation="note">
<rect x="240" y="460" width="220" height="54" rx="6" class="seq-note"/>
<rect x="240" y="465" width="3" height="44" rx="1.5" class="t-rework"/>
<text x="252" y="479" class="m s12 seq-note-text">The code expires after 15</text>
<text x="252" y="497" class="m s12 seq-note-text">minutes</text>
</g>
<g data-line="18" data-step="8">
<text x="96" y="542" class="m s12 seq-label">Email with the code</text>
<text x="0" y="560" class="m s11 muted seq-number">08</text>
<path d="M612,556 L88,556" class="e e-muted dash seq-response" marker-end="url(#claim-seq-response)"/>
</g>
<g data-line="19" data-annotation="section">
<text x="30" y="598" class="m s11 muted seq-section">VERIFY</text>
<line x1="81.6" y1="594" x2="670" y2="594" class="seq-rule"/>
</g>
<g data-line="20" data-step="9">
<text x="96" y="636" class="m s12 seq-label">Enter code</text>
<text x="0" y="654" class="m s11 muted seq-number">09</text>
<path d="M88,650 L219,650" class="e e-ink" marker-end="url(#claim-seq-ink)"/>
<circle cx="88" cy="650" r="2.5" class="t-ink"/>
</g>
<g data-line="21" data-step="10">
<text x="227" y="688" class="m s12 seq-label">POST verify code</text>
<text x="0" y="706" class="m s11 muted seq-number">10</text>
<path d="M219,702 L350,702" class="e e-system" marker-end="url(#claim-seq-system)"/>
<circle cx="219" cy="702" r="2.5" class="t-system"/>
</g>
<g data-line="22" data-step="11">
<text x="382" y="740" class="m s12 seq-label">Check code and expiry</text>
<text x="0" y="758" class="m s11 muted seq-number">11</text>
<path d="M350,754 H369 Q374,754 374,759 V771 Q374,776 369,776 H350" class="e e-system" marker-end="url(#claim-seq-system)"/>
<circle cx="350" cy="754" r="2.5" class="t-system"/>
</g>
<g data-line="23" data-annotation="open">
<text x="34" y="816" class="m s11 b seq-kind">ALT</text>
<text x="65.8" y="816" class="m s11 muted seq-group-label">CODE MATCHES</text>
</g>
<g data-line="24" data-step="12">
<text x="227" y="854" class="m s12 seq-label">Claim confirmed</text>
<text x="0" y="872" class="m s11 muted seq-number">12</text>
<path d="M350,868 L219,868" class="e e-muted dash seq-response" marker-end="url(#claim-seq-response)"/>
</g>
<g data-line="25" data-step="13">
<text x="96" y="906" class="m s12 seq-label">The show is yours</text>
<text x="0" y="924" class="m s11 muted seq-number">13</text>
<path d="M219,920 L88,920" class="e e-muted dash seq-response" marker-end="url(#claim-seq-response)"/>
</g>
<line x1="32" y1="946" x2="405.59999999999997" y2="946" class="seq-divider"/>
<g data-line="26" data-annotation="else">
<text x="34" y="968" class="m s11 b seq-kind">ELSE</text>
<text x="72.4" y="968" class="m s11 muted seq-else-label">WRONG OR EXPIRED CODE</text>
</g>
<g data-line="27" data-step="14">
<text x="227" y="1006" class="m s12 seq-label">Rejected, attempts left</text>
<text x="0" y="1024" class="m s11 muted seq-number">14</text>
<path d="M350,1020 L219,1020" class="e e-muted dash seq-response" marker-end="url(#claim-seq-response)"/>
</g>
<g data-line="28" data-step="15">
<text x="96" y="1058" class="m s12 seq-label">Try again or resend the code</text>
<text x="0" y="1076" class="m s11 muted seq-number">15</text>
<path d="M219,1072 L88,1072" class="e e-muted dash seq-response" marker-end="url(#claim-seq-response)"/>
</g>
</svg>
