<svg xmlns="http://www.w3.org/2000/svg" class="ab" viewBox="0 0 590 234" width="590" height="234" role="img" aria-label="Flow: needs-work, person, worker, retry, Finished">
<style>.ab{--ink:var(--ab-ink,#e5e9ef);--muted:var(--ab-muted,#98a2b0);--line:var(--ab-line,#2c3440);--band:var(--ab-band,#151b23);--surface:var(--ab-surface,#1d232d);--agent:var(--ab-agent,#5cc5bb);--agent-bg:var(--ab-agent-bg,#12302d);--rework:var(--ab-rework,#e3a250);--rework-bg:var(--ab-rework-bg,#33250f);--stop:var(--ab-stop,#ef7f73);--stop-bg:var(--ab-stop-bg,#3a1916);--done:var(--ab-done,#72cf91);--done-bg:var(--ab-done-bg,#142e1d);}
.ab text{font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;fill:var(--ink)}
.ab .m{font-family:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace}
.ab .s11{font-size:11px}.ab .s12{font-size:12px}.ab .s13{font-size:13px}
.ab .muted{fill:var(--muted)}.ab .b{font-weight:600}
.ab .cap{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;font-size:11px;letter-spacing:.08em;fill:var(--muted)}
.ab .band{fill:var(--band)}.ab .rule{stroke:var(--line);stroke-width:1.2;stroke-dasharray:3 5}
.ab .pill{fill:var(--surface);stroke:var(--line);stroke-width:1.2}
.ab .e{fill:none;stroke-width:1.6}.ab .dash{stroke-dasharray:6 5}
.ab .t-ink{fill:var(--muted)}.ab .e-ink{stroke:var(--muted)}.ab .k-ink{fill:var(--surface);stroke:var(--line);stroke-width:1.5}.ab .t-muted{fill:var(--muted)}.ab .e-muted{stroke:var(--muted)}.ab .k-muted{fill:var(--surface);stroke:var(--line);stroke-width:1.5}.ab .t-agent{fill:var(--agent)}.ab .e-agent{stroke:var(--agent)}.ab .k-agent{fill:var(--agent-bg);stroke:var(--agent);stroke-width:1.5}.ab .t-done{fill:var(--done)}.ab .e-done{stroke:var(--done)}.ab .k-done{fill:var(--done-bg);stroke:var(--done);stroke-width:1.5}.ab .t-rework{fill:var(--rework)}.ab .e-rework{stroke:var(--rework)}.ab .k-rework{fill:var(--rework-bg);stroke:var(--rework);stroke-width:1.5}.ab .t-stop{fill:var(--stop)}.ab .e-stop{stroke:var(--stop)}.ab .k-stop{fill:var(--stop-bg);stroke:var(--stop);stroke-width:1.5}
.ab .k-stop.panel{stroke-width:1.2;stroke-dasharray:5 4}</style>
<defs>
<marker id="primer-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" class="t-ink"/></marker>
<marker id="primer-rework" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" class="t-rework"/></marker>
<marker id="primer-stop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" class="t-stop"/></marker>
</defs>
<path d="M238,50 L238,94" class="e e-ink" marker-end="url(#primer-ink)"/>
<path d="M238,140 L238,184" class="e e-ink" marker-end="url(#primer-ink)"/>
<path d="M148,117 L88,117" class="e e-rework" marker-end="url(#primer-rework)"/>
<path d="M52,100 L52,33 L184,33" class="e e-rework" marker-end="url(#primer-rework)"/>
<path d="M328,117 L384,117" class="e e-stop" marker-end="url(#primer-stop)"/>
<g><rect x="184" y="16" width="108" height="34" rx="17" class="pill"/>
<circle cx="198" cy="33" r="5" class="t-muted"/>
<text x="210" y="37" class="m s12">needs-work</text></g>
<g>
<rect x="148" y="94" width="180" height="46" rx="8" class="k-agent"/>
<text x="238" y="113" text-anchor="middle" class="m s13 b t-agent">worker</text>
<text x="238" y="130" text-anchor="middle" class="s11 muted">does the work</text>
</g>
<rect x="153" y="184" width="170" height="34" rx="17" class="k-done"/>
<text x="238" y="205" text-anchor="middle" class="s12 b t-done">Finished</text>
<g><rect x="16" y="100" width="72" height="34" rx="17" class="pill"/>
<circle cx="30" cy="117" r="5" class="t-rework"/>
<text x="42" y="121" class="m s12">retry</text></g>
<g><rect x="384" y="80" width="190" height="74" rx="10" class="k-stop panel"/>
<rect x="422" y="92" width="115" height="30" rx="15" class="pill"/>
<circle cx="436" cy="107" r="5" class="t-stop"/>
<text x="448" y="111" class="m s12">needs-human</text>
<text x="479" y="141" text-anchor="middle" class="s11 muted">a person decides</text></g>
<text x="248" y="76" class="m s11">start</text>
<text x="248" y="166" class="m s11">finished</text>
<text x="138" y="110" text-anchor="end" class="m s11 t-rework">failed</text>
<text x="174" y="26" text-anchor="end" class="m s11 t-rework">again</text>
<text x="338" y="110" class="m s11 t-stop">stuck</text>
</svg>
