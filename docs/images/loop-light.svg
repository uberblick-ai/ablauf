<text x="378" y="340" text-anchor="middle" class="s11 muted">codes, checks, opens the PR</text>
</g>
<g><rect x="317" y="388" width="122" height="34" rx="17" class="pill"/>
<circle cx="331" cy="405" r="5" class="t-agent"/>
<text x="343" y="409" class="m s12">needs-review</text></g>
<g>
<rect x="278" y="452" width="199" height="46" rx="8" class="k-agent"/>
<text x="378" y="471" text-anchor="middle" class="m s13 b t-agent">reviewer</text>
<text x="378" y="488" text-anchor="middle" class="s11 muted">reviews the exact head SHA</text>
</g>
<g><rect x="309" y="536" width="137" height="34" rx="17" class="pill"/>
<circle cx="323" cy="553" r="5" class="t-done"/>
<text x="335" y="557" class="m s12">ready-to-merge</text></g>
<g>
<rect x="278" y="600" width="199" height="46" rx="8" class="k-agent"/>
<text x="378" y="619" text-anchor="middle" class="m s13 b t-agent">integrator</text>
<text x="378" y="636" text-anchor="middle" class="s11 muted">updates base, checks, merges</text>
</g>
<rect x="287" y="684" width="181" height="34" rx="17" class="k-done"/>
<text x="378" y="705" text-anchor="middle" class="s12 b t-done">Merged · issue closed</text>
<g><rect x="16" y="458" width="130" height="34" rx="17" class="pill"/>
<circle cx="30" cy="475" r="5" class="t-rework"/>
<text x="42" y="479" class="m s12">needs-changes</text></g>
<g><rect x="554" y="388" width="216" height="182" rx="10" class="k-stop panel"/>
<rect x="605" y="420" width="115" height="30" rx="15" class="pill"/>
<circle cx="619" cy="435" r="5" class="t-stop"/>
<text x="631" y="439" class="m s12">needs-human</text>
<text x="662" y="469" text-anchor="middle" class="s11 muted">or an Action needed comment</text>
<line x1="570" y1="481" x2="754" y2="481" class="rule"/>
<text x="662" y="501" text-anchor="middle" class="s12 b">A person decides</text>
<text x="662" y="519" text-anchor="middle" class="s11">adds the trigger of any role</text>
<text x="662" y="537" text-anchor="middle" class="s11 muted">blocked, same role: retry</text></g>
<text x="388" y="119" class="m s11">trigger</text>
<text x="388" y="203" class="m s11">prepared</text>
<text x="388" y="373" class="m s11">handed-off</text>
<text x="388" y="521" class="m s11">approved</text>
<text x="388" y="669" class="m s11">merged</text>
<text x="268" y="468" text-anchor="end" class="m s11 t-rework">changes-requested</text>
<text x="299" y="546" text-anchor="end" class="m s11 t-rework">on-conflict · launcher</text>
<text x="268" y="616" text-anchor="end" class="m s11 t-rework">changes-requested</text>
<text x="268" y="320" text-anchor="end" class="m s11 t-rework">revise the same PR</text>
<text x="487" y="150" class="m s11 t-stop">needs-human</text>
<text x="487" y="320" class="m s11 t-stop">blocked</text>
