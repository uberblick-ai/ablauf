<path d="M477,327 L626,327 L626,388" class="e e-stop" marker-end="url(#loop-stop)"/>
<path d="M477,475 L554,475" class="e e-stop" marker-end="url(#loop-stop)"/>
<path d="M477,623 L662,623 L662,570" class="e e-stop" marker-end="url(#loop-stop)"/>
<text x="378" y="28" text-anchor="middle" class="s12 muted">A maintainer adds the first label</text>
<g><rect x="299" y="62" width="158" height="34" rx="17" class="pill"/>
<circle cx="313" cy="79" r="5" class="t-muted"/>
<text x="325" y="83" class="m s12">needs-preparation</text></g>
<g>
<rect x="278" y="134" width="199" height="46" rx="8" class="k-agent"/>
<text x="378" y="153" text-anchor="middle" class="m s13 b t-agent">issue-preparer</text>
<text x="378" y="170" text-anchor="middle" class="s11 muted">writes scope and criteria</text>
</g>
<g><rect x="342" y="218" width="72" height="34" rx="17" class="pill"/>
