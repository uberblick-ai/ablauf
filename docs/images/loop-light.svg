<text x="487" y="616" class="m s11 t-stop">maintainer-merge, blocked</text>
<line x1="8" y1="734" x2="778" y2="734" class="rule"/>
<g><rect x="16" y="748" width="24" height="12" rx="6" class="pill"/><circle cx="23" cy="754" r="3" class="t-muted"/><text x="46" y="758" class="s11 muted">GitHub label</text></g>
<g><rect x="139" y="748" width="24" height="12" rx="3" class="k-agent"/><text x="169" y="758" class="s11 muted">agent role</text></g>
<g><rect x="250" y="748" width="24" height="12" rx="3" class="k-stop panel"/><text x="280" y="758" class="s11 muted">a person decides</text></g>
<g><path d="M398,754 L422,754" class="e e-rework dash" marker-end="url(#loop-rework)"/><text x="428" y="758" class="s11 muted">set by the launcher</text></g>
</svg>
