<text x="631" y="411" class="m s12">needs-human</text>
<text x="662" y="441" text-anchor="middle" class="s11 muted">or an Action needed comment</text>
<line x1="570" y1="453" x2="754" y2="453" class="rule"/>
<text x="662" y="473" text-anchor="middle" class="s12 b">A person decides</text>
