<svg xmlns="http://www.w3.org/2000/svg" class="ab" viewBox="0 0 710 520" width="710" height="520" role="img" aria-label="Flow: cart, address, fraud, payment, card declined, pick, ship, Delivered. Legend: state, automated step, manual review, customer retries">
<style>.ab{--ink:var(--ab-ink,#e5e9ef);--muted:var(--ab-muted,#98a2b0);--line:var(--ab-line,#2c3440);--band:var(--ab-band,#151b23);--surface:var(--ab-surface,#1d232d);--agent:var(--ab-agent,#5cc5bb);--agent-bg:var(--ab-agent-bg,#12302d);--rework:var(--ab-rework,#e3a250);--rework-bg:var(--ab-rework-bg,#33250f);--stop:var(--ab-stop,#ef7f73);--stop-bg:var(--ab-stop-bg,#3a1916);--done:var(--ab-done,#72cf91);--done-bg:var(--ab-done-bg,#142e1d);}
.ab text{font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;fill:var(--ink)}
.ab .m{font-family:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace}
.ab .s11{font-size:11px}.ab .s12{font-size:12px}.ab .s13{font-size:13px}
.ab .muted{fill:var(--muted)}.ab .b{font-weight:600}
.ab .cap{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;font-size:11px;letter-spacing:.08em;fill:var(--muted)}
.ab .band{fill:var(--band)}.ab .rule{stroke:var(--line);stroke-width:1.2;stroke-dasharray:3 5}
.ab .pill{fill:var(--surface);stroke:var(--line);stroke-width:1.2}
.ab .e{fill:none;stroke-width:1.6}.ab .dash{stroke-dasharray:6 5}
.ab .t-ink{fill:var(--muted)}.ab .e-ink{stroke:var(--muted)}.ab .k-ink{fill:var(--surface);stroke:var(--line);stroke-width:1.5}.ab .t-muted{fill:var(--muted)}.ab .e-muted{stroke:var(--muted)}.ab .k-muted{fill:var(--surface);stroke:var(--line);stroke-width:1.5}.ab .t-agent{fill:var(--agent)}.ab .e-agent{stroke:var(--agent)}.ab .k-agent{fill:var(--agent-bg);stroke:var(--agent);stroke-width:1.5}.ab .t-done{fill:var(--done)}.ab .e-done{stroke:var(--done)}.ab .k-done{fill:var(--done-bg);stroke:var(--done);stroke-width:1.5}.ab .t-rework{fill:var(--rework)}.ab .e-rework{stroke:var(--rework)}.ab .k-rework{fill:var(--rework-bg);stroke:var(--rework);stroke-width:1.5}.ab .t-stop{fill:var(--stop)}.ab .e-stop{stroke:var(--stop)}.ab .k-stop{fill:var(--stop-bg);stroke:var(--stop);stroke-width:1.5}
.ab .k-stop.panel{stroke-width:1.2;stroke-dasharray:5 4}</style>
<defs>
<marker id="checkout-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" class="t-ink"/></marker>
<marker id="checkout-rework" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" class="t-rework"/></marker>
<marker id="checkout-stop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" class="t-stop"/></marker>
</defs>
<text x="20" y="22" class="cap">CHECKOUT</text>
<rect x="8" y="246" width="694" height="228" class="band"/>
<line x1="8" y1="246" x2="702" y2="246" class="rule"/>
<text x="20" y="268" class="cap">FULFILMENT</text>
<path d="M310,50 L310,88" class="e e-ink" marker-end="url(#checkout-ink)"/>
<path d="M309,134 L309,169" class="e e-ink" marker-end="url(#checkout-ink)"/>
<path d="M309,215 L309,272" class="e e-ink" marker-end="url(#checkout-ink)"/>
<path d="M309,318 L309,348" class="e e-ink" marker-end="url(#checkout-ink)"/>
<path d="M309,394 L309,432" class="e e-ink" marker-end="url(#checkout-ink)"/>
<path d="M219,192 L146,192" class="e e-rework" marker-end="url(#checkout-rework)"/>
<path d="M81,175 L81,111 L219,111" class="e e-rework" marker-end="url(#checkout-rework)"/>
<path d="M399,192 L465,192" class="e e-stop" marker-end="url(#checkout-stop)"/>
<path d="M580,220 L580,295 L399,295" class="e e-stop" marker-end="url(#checkout-stop)"/>
<g><rect x="277" y="16" width="65" height="34" rx="17" class="pill"/>
<circle cx="291" cy="33" r="5" class="t-muted"/>
<text x="303" y="37" class="m s12">cart</text></g>
<g>
<rect x="219" y="88" width="180" height="46" rx="8" class="k-agent"/>
<text x="309" y="107" text-anchor="middle" class="m s13 b t-agent">address</text>
<text x="309" y="124" text-anchor="middle" class="s11 muted">shipping address</text>
</g>
<g>
<rect x="219" y="169" width="180" height="46" rx="8" class="k-agent"/>
<text x="309" y="188" text-anchor="middle" class="m s13 b t-agent">payment</text>
<text x="309" y="205" text-anchor="middle" class="s11 muted">authorise the card</text>
</g>
<g>
<rect x="219" y="272" width="180" height="46" rx="8" class="k-agent"/>
<text x="309" y="291" text-anchor="middle" class="m s13 b t-agent">pick</text>
<text x="309" y="308" text-anchor="middle" class="s11 muted">pick and pack</text>
</g>
<g>
<rect x="219" y="348" width="180" height="46" rx="8" class="k-agent"/>
<text x="309" y="367" text-anchor="middle" class="m s13 b t-agent">ship</text>
<text x="309" y="384" text-anchor="middle" class="s11 muted">hand to the carrier</text>
</g>
<rect x="224" y="432" width="170" height="34" rx="17" class="k-done"/>
<text x="309" y="453" text-anchor="middle" class="s12 b t-done">Delivered</text>
<g><rect x="16" y="175" width="130" height="34" rx="17" class="pill"/>
<circle cx="30" cy="192" r="5" class="t-rework"/>
<text x="42" y="196" class="m s12">card declined</text></g>
<g><rect x="465" y="164" width="229" height="56" rx="10" class="k-stop panel"/>
<text x="580" y="189" text-anchor="middle" class="s12 b">Fraud review</text>
<text x="580" y="207" text-anchor="middle" class="s11 muted">an analyst checks risky orders</text></g>
<text x="320" y="73" class="m s11">check out</text>
<text x="319" y="248" class="m s11">authorised</text>
<text x="319" y="417" class="m s11">tracked</text>
<text x="209" y="185" text-anchor="end" class="m s11 t-rework">declined</text>
<text x="209" y="104" text-anchor="end" class="m s11 t-rework">try another card</text>
<text x="409" y="185" class="m s11 t-stop">flagged</text>
<text x="409" y="288" class="m s11 t-stop">cleared</text>
<line x1="8" y1="482" x2="702" y2="482" class="rule"/>
<g><rect x="16" y="496" width="24" height="12" rx="6" class="pill"/><circle cx="23" cy="502" r="3" class="t-muted"/><text x="46" y="506" class="s11 muted">state</text></g>
<g><rect x="97" y="496" width="24" height="12" rx="3" class="k-agent"/><text x="127" y="506" class="s11 muted">automated step</text></g>
<g><rect x="232" y="496" width="24" height="12" rx="3" class="k-stop panel"/><text x="262" y="506" class="s11 muted">manual review</text></g>
<g><path d="M361,502 L385,502" class="e e-rework" marker-end="url(#checkout-rework)"/><text x="391" y="506" class="s11 muted">customer retries</text></g>
</svg>
