<svg xmlns="http://www.w3.org/2000/svg" class="ab ab-light" viewBox="0 0 710 235" width="710" height="235">
<title>Sequence diagram comparison</title>
<style>.ab.ab-light{--bg:var(--ab-bg,#ffffff);--ink:var(--ab-ink,#17202c);--muted:var(--ab-muted,#5a6575);--line:var(--ab-line,#d3d9e2);--band:var(--ab-band,#e9eef5);--surface:var(--ab-surface,#ffffff);--neutral:var(--ab-neutral,#59616c);--neutral-bg:var(--ab-neutral-bg,#e1e3e6);--agent:var(--ab-agent,#3e6563);--agent-bg:var(--ab-agent-bg,#e7eeed);--system:var(--ab-system,#4f5d76);--system-bg:var(--ab-system-bg,#ebedf3);--rework:var(--ab-rework,#826954);--rework-bg:var(--ab-rework-bg,#f3f0eb);--stop:var(--ab-stop,#815f5a);--stop-bg:var(--ab-stop-bg,#ede6e5);--done:var(--ab-done,#536e5a);--done-bg:var(--ab-done-bg,#e8ede9);}
.ab text{font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;fill:var(--ink)}
.ab .m{font-family:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace}
.ab .s11{font-size:11px}.ab .s12{font-size:12px}.ab .s13{font-size:13px}
.ab .muted{fill:var(--muted)}.ab .b{font-weight:600}
.ab .cap{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;font-size:11px;letter-spacing:.08em;fill:var(--muted)}
.ab .band{fill:var(--band)}.ab .rule{stroke:var(--line);stroke-width:1.2;stroke-dasharray:3 5}
.ab .pill{fill:var(--surface);stroke:var(--line);stroke-width:1.2}
.ab .e{fill:none;stroke-width:1.6}.ab .dash{stroke-dasharray:6 5}
.ab .knockout{fill:none;stroke:var(--bg);stroke-width:5.6}.ab .knockout-band{stroke:var(--band)}
.ab .arrow{fill:none;stroke:none}
.ab .t-ink{fill:var(--muted)}.ab .e-ink{stroke:var(--muted)}.ab .k-ink{fill:var(--surface);stroke:var(--line);stroke-width:1.5}.ab .t-muted{fill:var(--muted)}.ab .e-muted{stroke:var(--muted)}.ab .k-muted{fill:var(--surface);stroke:var(--line);stroke-width:1.5}.ab .t-neutral{fill:var(--neutral)}.ab .e-neutral{stroke:var(--neutral)}.ab .k-neutral{fill:var(--neutral-bg);stroke:var(--neutral);stroke-width:1.5}.ab .t-agent{fill:var(--agent)}.ab .e-agent{stroke:var(--agent)}.ab .k-agent{fill:var(--agent-bg);stroke:var(--agent);stroke-width:1.5}.ab .t-system{fill:var(--system)}.ab .e-system{stroke:var(--system)}.ab .k-system{fill:var(--system-bg);stroke:var(--system);stroke-width:1.5}.ab .t-done{fill:var(--done)}.ab .e-done{stroke:var(--done)}.ab .k-done{fill:var(--done-bg);stroke:var(--done);stroke-width:1.5}.ab .t-rework{fill:var(--rework)}.ab .e-rework{stroke:var(--rework)}.ab .k-rework{fill:var(--rework-bg);stroke:var(--rework);stroke-width:1.5}.ab .t-stop{fill:var(--stop)}.ab .e-stop{stroke:var(--stop)}.ab .k-stop{fill:var(--stop-bg);stroke:var(--stop);stroke-width:1.5}
.ab .k-stop.panel{stroke-width:1.2;stroke-dasharray:5 4}
.ab .life{stroke:var(--line);stroke-width:1.4;stroke-dasharray:4 4}
.ab .gap{fill:var(--bg)}.ab .gap-band{fill:var(--band)}
.ab .grp{fill:none;stroke:var(--neutral);stroke-opacity:.55;stroke-width:1.2}
.ab .grp-tag{fill:var(--neutral-bg);stroke:var(--neutral);stroke-opacity:.55;stroke-width:1.2}
.ab .open{fill:none;stroke:var(--muted);stroke-width:1.6;stroke-linejoin:round}
.ab .lane{fill:var(--neutral-bg);opacity:.4}.ab .life-faint{stroke:var(--line);stroke-width:1}
.ab .life-tone{stroke-width:1;stroke-opacity:.35}
.ab .sec-rule{stroke:var(--line);stroke-width:1}
.ab .grp-soft{fill:var(--neutral-bg);opacity:.55}.ab .grp-split{stroke:var(--neutral);stroke-opacity:.35;stroke-width:1;stroke-dasharray:2 4}
.ab .cap-b{font-weight:600;fill:var(--ink)}
.ab .note-soft{fill:var(--rework-bg)}
.ab .num{fill:var(--muted);opacity:.7}.ab .resp{stroke-width:1.3}</style>
<defs><marker id="light-fill-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" class="t-ink"/></marker><marker id="light-fill-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" class="t-muted"/></marker><marker id="light-fill-neutral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" class="t-neutral"/></marker><marker id="light-fill-agent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" class="t-agent"/></marker><marker id="light-fill-system" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" class="t-system"/></marker><marker id="light-fill-done" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" class="t-done"/></marker><marker id="light-fill-rework" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" class="t-rework"/></marker><marker id="light-fill-stop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" class="t-stop"/></marker><marker id="light-open" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L9,5 L1,9" class="open"/></marker></defs>
<rect width="710" height="235" fill="var(--bg)"/>
<rect x="41" y="10" width="322" height="209" rx="10" class="lane"/>
<path d="M202,51 L202,213" class="life-faint"/>
<path d="M530,51 L530,213" class="life-faint"/>
<rect x="44" y="65" width="644" height="138" rx="10" class="grp-soft"/>
<circle cx="202" cy="18" r="3.5" class="t-agent"/>
<text x="202" y="41.5" text-anchor="middle" class="m s12 b t-agent">Studio</text>
<circle cx="530" cy="18" r="3.5" class="t-system"/>
<text x="530" y="41.5" text-anchor="middle" class="m s12 b t-system">Backend</text>
<path d="M530,115 L205,115" class="e e-ink dash resp" marker-end="url(#light-open)"/>
<path d="M530,181 L205,181" class="e e-ink dash resp" marker-end="url(#light-open)"/>

<text x="210" y="105" text-anchor="start" class="s12">Claim confirmed</text>
<text x="18" y="119" class="m s11 num">01</text>

<text x="210" y="171" text-anchor="start" class="s12">Rejected, attempts left</text>
<text x="18" y="185" class="m s11 num">02</text>
<text x="56" y="83" class="cap"><tspan class="cap-b">ALT</tspan>  CODE MATCHES</text>
<path d="M54,135 L678,135" class="grp-split"/>
<text x="56" y="152" class="cap"><tspan class="cap-b">ELSE</tspan>  WRONG OR EXPIRED CODE</text>
</svg>
