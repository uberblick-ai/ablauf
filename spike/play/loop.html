<script>
// Plays a timeline on a rendered SVG by setting classes on its parts: the
// current step's parts are `ab-on`, earlier ones `ab-done`, and the SVG is
// `ab-playing` so later parts fade. It draws no controls; the host does.

                                              

                         
	                                                
	                       
	                          
	             
	              
	                                                               
	                          
	             
	                 
	                                                            
	              
	                
 

                                
	                                                       
	                                    
	                                                                  
	               
 

function createPlayer(svg         , timeline                , options                = {})         {
	const parts = new Map                   ();
	for (const el of svg.querySelectorAll("[data-ab-part]")) {
		const name = el.getAttribute("data-ab-part") ?? "";
		parts.set(name, [...(parts.get(name) ?? []), el]);
	}
	let index = -1;
	let playing = false;
	let timer                                           ;

	const paint = () => {
		for (const list of parts.values()) for (const el of list) el.classList.remove("ab-on", "ab-done");
		svg.classList.toggle("ab-playing", index >= 0);
		for (let k = 0; k <= index; k++) {
			for (const name of timeline[k].parts) {
				for (const el of parts.get(name) ?? []) {
					el.classList.toggle("ab-on", k === index);
					el.classList.toggle("ab-done", k < index);
				}
			}
		}
	};
	const schedule = () => {
		clearTimeout(timer);
		if (!playing || index < 0) return;
		timer = setTimeout(() => {
			if (index + 1 < timeline.length) show(index + 1);
			else if (options.loop) show(0);
			else {
				playing = false;
				options.onChange?.(player);
			}
		}, timeline[index].ms);
	};
	const show = (i        ) => {
		index = Math.max(-1, Math.min(i, timeline.length - 1));
		paint();
		schedule();
		options.onChange?.(player);
	};
	const player         = {
		get index() {
			return index;
		},
		get playing() {
			return playing;
		},
		play() {
			if (!timeline.length) return;
			playing = true;
			// Playing from the end starts over.
			show(index < 0 || index >= timeline.length - 1 ? 0 : index);
		},
		pause() {
			playing = false;
			clearTimeout(timer);
			options.onChange?.(player);
		},
		seek: show,
		next: () => show(index + 1),
		previous: () => show(Math.max(index - 1, 0)),
		reset() {
			playing = false;
			show(-1);
		},
		destroy() {
			clearTimeout(timer);
			playing = false;
		},
	};
	return player;
}

const STEPS = [{"parts":["node:start"],"ms":1600,"caption":"A maintainer adds the first label"},{"parts":["node:needs-preparation","edge:start>needs-preparation"],"ms":1600,"caption":""},{"parts":["node:issue-preparer","edge:needs-preparation>issue-preparer"],"ms":1600,"caption":"found the issue small and clear, marked it ready"},{"parts":["node:ready","edge:issue-preparer>ready"],"ms":1600,"caption":""},{"parts":["node:implementer","edge:ready>implementer"],"ms":2400,"caption":"changed 7 files, ran 2,109 tests, opened #598"},{"parts":["node:needs-review","edge:implementer>needs-review"],"ms":1600,"caption":""},{"parts":["node:reviewer","edge:needs-review>reviewer"],"ms":2400,"caption":"changes requested: P1 in the parser"},{"parts":["node:needs-changes","edge:reviewer>needs-changes"],"ms":1600,"caption":""},{"parts":["node:implementer","edge:needs-changes>implementer"],"ms":2400,"caption":"revised the same PR, fixed the P1"},{"parts":["node:needs-review","edge:implementer>needs-review"],"ms":1600,"caption":""},{"parts":["node:reviewer","edge:needs-review>reviewer"],"ms":1600,"caption":"approved against the acceptance criteria"},{"parts":["node:ready-to-merge","edge:reviewer>ready-to-merge"],"ms":1600,"caption":""},{"parts":["node:integrator","edge:ready-to-merge>integrator"],"ms":2000,"caption":"confirmed CI and the merge policy"},{"parts":["node:merged","edge:integrator>merged"],"ms":3000,"caption":"#598 merged, #597 closed"}];
const button = document.getElementById("play");
const segs = document.getElementById("segs");
const caption = document.getElementById("caption");
const p = createPlayer(document.querySelector("svg.ab"), STEPS, {
  onChange(p) {
    button.textContent = p.playing ? "Pause" : "Play";
    caption.textContent = p.index >= 0 ? STEPS[p.index].caption : "";
    [...segs.children].forEach((b, k) => { b.className = k === p.index ? "on" : k < p.index ? "done" : ""; });
  },
});
STEPS.forEach((_, i) => {
  const b = document.createElement("button");
  b.type = "button";
  b.setAttribute("aria-label", `Step ${i + 1}`);
  b.onclick = () => { p.pause(); p.seek(i); };
  segs.append(b);
});
button.onclick = () => (p.playing ? p.pause() : p.play());
if (!matchMedia("(prefers-reduced-motion: reduce)").matches) p.play();
</script>
