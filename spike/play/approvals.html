<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>spike/play/approvals.flow</title>
<style>
:root{color-scheme:light dark;--page:#f6f7f9;--fg:#17202c;--mute:#5a6575;--rail:#d3d9e2}
@media (prefers-color-scheme:dark){:root{--page:#11151b;--fg:#e5e9ef;--mute:#98a2b0;--rail:#2c3440}}
body{margin:0;background:var(--page);color:var(--fg);font:14px/1.4 system-ui,sans-serif}
main{max-width:820px;margin:0 auto;padding:24px 16px}
.bar{display:flex;gap:8px;align-items:center}
button{font:inherit;color:inherit;background:none;border:1px solid var(--rail);border-radius:999px;height:32px;padding:0 12px;cursor:pointer}
#segs{flex:1;display:flex;gap:3px}
#segs button{flex:1;height:6px;padding:0;border:0;border-radius:3px;background:var(--rail)}
#segs button.done{background:var(--mute)}
#segs button.on{background:var(--fg)}
#caption{min-height:20px;margin:14px 0 8px;color:var(--mute)}
svg{max-width:100%;height:auto}
</style>
</head>
<body>
<main>
<div class="bar"><button type="button" id="play">Play</button><div id="segs"></div></div>
<p id="caption" aria-live="polite"></p>
<svg xmlns="http://www.w3.org/2000/svg" class="ab ab-auto" viewBox="0 0 678 251" width="678" height="251" role="img" aria-label="Fan-out: Check whether approval permits the run. Approved: A maintainer started it and the input is unchanged; destination: Start the run. Outside input: The input has not been cleared by a maintainer; destination: Ask a maintainer. Edited since: The input changed after the maintainer started it; destination: Ask a maintainer">
<style>.ab.ab-auto{--bg:var(--ab-bg,#ffffff);--ink:var(--ab-ink,#17202c);--muted:var(--ab-muted,#5a6575);--line:var(--ab-line,#d3d9e2);--band:var(--ab-band,#e9eef5);--surface:var(--ab-surface,#ffffff);--neutral:var(--ab-neutral,#59616c);--neutral-bg:var(--ab-neutral-bg,#e1e3e6);--agent:var(--ab-agent,#3e6563);--agent-bg:var(--ab-agent-bg,#e7eeed);--system:var(--ab-system,#4f5d76);--system-bg:var(--ab-system-bg,#ebedf3);--rework:var(--ab-rework,#826954);--rework-bg:var(--ab-rework-bg,#f3f0eb);--stop:var(--ab-stop,#815f5a);--stop-bg:var(--ab-stop-bg,#ede6e5);--done:var(--ab-done,#536e5a);--done-bg:var(--ab-done-bg,#e8ede9);}@media (prefers-color-scheme:dark){.ab.ab-auto{--bg:var(--ab-bg,#171c24);--ink:var(--ab-ink,#e5e9ef);--muted:var(--ab-muted,#98a2b0);--line:var(--ab-line,#2c3440);--band:var(--ab-band,#151b23);--surface:var(--ab-surface,#1d232d);--neutral:var(--ab-neutral,#b6bbc3);--neutral-bg:var(--ab-neutral-bg,#303640);--agent:var(--ab-agent,#85aaa5);--agent-bg:var(--ab-agent-bg,#232d2b);--system:var(--ab-system,#98a5bf);--system-bg:var(--ab-system-bg,#262a31);--rework:var(--ab-rework,#b29d87);--rework-bg:var(--ab-rework-bg,#2c2720);--stop:var(--ab-stop,#ac8c88);--stop-bg:var(--ab-stop-bg,#2b2221);--done:var(--ab-done,#95b09c);--done-bg:var(--ab-done-bg,#222a24);}}
.ab text{font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;fill:var(--ink)}
.ab .m{font-family:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace}
.ab .s11{font-size:11px}.ab .s12{font-size:12px}.ab .s13{font-size:13px}
.ab .muted{fill:var(--muted)}.ab .b{font-weight:600}
.ab .cap{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;font-size:11px;letter-spacing:.08em;fill:var(--muted)}
.ab .band{fill:var(--band)}.ab .rule{stroke:var(--line);stroke-width:1.2;stroke-dasharray:3 5}
.ab .pill{fill:var(--surface);stroke:var(--line);stroke-width:1.2}
.ab .e{fill:none;stroke-width:1.6}.ab .dash{stroke-dasharray:6 5}
.ab .knockout{fill:none;stroke:var(--bg);stroke-width:5.6}.ab .knockout-band{stroke:var(--band)}
.ab .arrow{fill:none;stroke:none}
.ab .t-ink{fill:var(--muted)}.ab .e-ink{stroke:var(--muted)}.ab .k-ink{fill:var(--surface);stroke:var(--line);stroke-width:1.5}.ab .t-muted{fill:var(--muted)}.ab .e-muted{stroke:var(--muted)}.ab .k-muted{fill:var(--surface);stroke:var(--line);stroke-width:1.5}.ab .t-neutral{fill:var(--neutral)}.ab .e-neutral{stroke:var(--neutral)}.ab .k-neutral{fill:var(--neutral-bg);stroke:var(--neutral);stroke-width:1.5}.ab .t-agent{fill:var(--agent)}.ab .e-agent{stroke:var(--agent)}.ab .k-agent{fill:var(--agent-bg);stroke:var(--agent);stroke-width:1.5}.ab .t-system{fill:var(--system)}.ab .e-system{stroke:var(--system)}.ab .k-system{fill:var(--system-bg);stroke:var(--system);stroke-width:1.5}.ab .t-done{fill:var(--done)}.ab .e-done{stroke:var(--done)}.ab .k-done{fill:var(--done-bg);stroke:var(--done);stroke-width:1.5}.ab .t-rework{fill:var(--rework)}.ab .e-rework{stroke:var(--rework)}.ab .k-rework{fill:var(--rework-bg);stroke:var(--rework);stroke-width:1.5}.ab .t-stop{fill:var(--stop)}.ab .e-stop{stroke:var(--stop)}.ab .k-stop{fill:var(--stop-bg);stroke:var(--stop);stroke-width:1.5}
.ab .k-stop.panel{stroke-width:1.2;stroke-dasharray:5 4}
.ab [data-ab-part]{transition:opacity .3s}
.ab.ab-playing [data-ab-part]:not(.ab-on):not(.ab-done){opacity:.3}
.ab .ab-on rect:not(.gap),.ab .ab-on path.decision{stroke:var(--ab-play,var(--ink));stroke-width:2.4}
.ab path.e.ab-on,.ab .ab-on path.e{stroke:var(--ab-play,var(--ink));stroke-width:2.4;stroke-dasharray:6 5;animation:ab-run .6s linear infinite}
@keyframes ab-run{to{stroke-dashoffset:-11}}
@media (prefers-reduced-motion:reduce){.ab path.e.ab-on,.ab .ab-on path.e{animation:none}}</style>
<defs><marker id="ab-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" class="t-ink"/></marker></defs>
<g data-ab-part="step">
<rect x="16" y="86.5" width="150" height="78" rx="8" class="k-agent"/>
<text x="32" y="112.5" class="m s13 b t-agent">Check whether</text>
<text x="32" y="130.5" class="m s13 b t-agent">approval</text>
<text x="32" y="148.5" class="m s13 b t-agent">permits the run</text>
</g>
<g data-line="4" data-ab-part="outcome:1">
<path d="M166,125.5 C183,125.5 183,33 200,33 L214,33" class="e e-ink" marker-end="url(#ab-ink)"/>
<rect x="216" y="16" width="170" height="34" rx="8" class="k-done"/>
<text x="230" y="38" class="m s12 b">Approved</text>
<path d="M386,33 L414,33" class="e e-ink" marker-end="url(#ab-ink)"/>
<text x="426" y="37" class="m s12 b">Start the run</text>
<text x="426" y="55" class="m s12 muted">A maintainer started it and the</text>
<text x="426" y="73" class="m s12 muted">input is unchanged</text>
</g>
<g data-line="5" data-ab-part="outcome:2">
<path d="M166,125.5 C183,125.5 183,112 200,112 L214,112" class="e e-ink" marker-end="url(#ab-ink)"/>
<rect x="216" y="95" width="170" height="34" rx="8" class="k-stop panel"/>
<text x="230" y="117" class="m s12 b">Outside input</text>
<path d="M386,112 L414,112" class="e e-ink" marker-end="url(#ab-ink)"/>
<text x="426" y="116" class="m s12 b">Ask a maintainer</text>
<text x="426" y="134" class="m s12 muted">The input has not been cleared</text>
<text x="426" y="152" class="m s12 muted">by a maintainer</text>
</g>
<g data-line="6" data-ab-part="outcome:3">
<path d="M166,125.5 C183,125.5 183,191 200,191 L214,191" class="e e-ink" marker-end="url(#ab-ink)"/>
<rect x="216" y="174" width="170" height="34" rx="8" class="k-stop panel"/>
<text x="230" y="196" class="m s12 b">Edited since</text>
<path d="M386,191 L414,191" class="e e-ink" marker-end="url(#ab-ink)"/>
<text x="426" y="195" class="m s12 b">Ask a maintainer</text>
<text x="426" y="213" class="m s12 muted">The input changed after the</text>
<text x="426" y="231" class="m s12 muted">maintainer started it</text>
</g>
</svg>


</main>
<script>
// Plays a timeline on a rendered SVG by setting classes on its parts: the
// current step's parts are `ab-on`, earlier ones `ab-done`, and the SVG is
// `ab-playing` so later parts fade. It draws no controls; the host does.

                                              

                         
	                                                
	                       
	                          
	             
	              
	                                                               
	                          
	             
	                 
	                                                            
	              
	                
 

                                
	                                                       
	                                    
	                                                                  
	               
 

function createPlayer(svg         , timeline                , options                = {})         {
	const parts = new Map                   ();
	for (const el of svg.querySelectorAll("[data-ab-part]")) {
		const name = el.getAttribute("data-ab-part") ?? "";
		parts.set(name, [...(parts.get(name) ?? []), el]);
	}
	let index = -1;
	let playing = false;
	let timer                                           ;

	const paint = () => {
		for (const list of parts.values()) for (const el of list) el.classList.remove("ab-on", "ab-done");
		svg.classList.toggle("ab-playing", index >= 0);
		for (let k = 0; k <= index; k++) {
			for (const name of timeline[k].parts) {
				for (const el of parts.get(name) ?? []) {
					el.classList.toggle("ab-on", k === index);
					el.classList.toggle("ab-done", k < index);
				}
			}
		}
	};
	const schedule = () => {
		clearTimeout(timer);
		if (!playing || index < 0) return;
		timer = setTimeout(() => {
			if (index + 1 < timeline.length) show(index + 1);
			else if (options.loop) show(0);
			else {
				playing = false;
				options.onChange?.(player);
			}
		}, timeline[index].ms);
	};
	const show = (i        ) => {
		index = Math.max(-1, Math.min(i, timeline.length - 1));
		paint();
		schedule();
		options.onChange?.(player);
	};
	const player         = {
		get index() {
			return index;
		},
		get playing() {
			return playing;
		},
		play() {
			if (!timeline.length) return;
			playing = true;
			// Playing from the end starts over.
			show(index < 0 || index >= timeline.length - 1 ? 0 : index);
		},
		pause() {
			playing = false;
			clearTimeout(timer);
			options.onChange?.(player);
		},
		seek: show,
		next: () => show(index + 1),
		previous: () => show(Math.max(index - 1, 0)),
		reset() {
			playing = false;
			show(-1);
		},
		destroy() {
			clearTimeout(timer);
			playing = false;
		},
	};
	return player;
}

const STEPS = [{"parts":["step","outcome:1"],"ms":2000,"caption":""},{"parts":["step","outcome:2"],"ms":2000,"caption":""},{"parts":["step","outcome:3"],"ms":2000,"caption":""}];
const button = document.getElementById("play");
const segs = document.getElementById("segs");
const caption = document.getElementById("caption");
const p = createPlayer(document.querySelector("svg.ab"), STEPS, {
  onChange(p) {
    button.textContent = p.playing ? "Pause" : "Play";
    caption.textContent = p.index >= 0 ? STEPS[p.index].caption : "";
    [...segs.children].forEach((b, k) => { b.className = k === p.index ? "on" : k < p.index ? "done" : ""; });
  },
});
STEPS.forEach((_, i) => {
  const b = document.createElement("button");
  b.type = "button";
  b.setAttribute("aria-label", `Step ${i + 1}`);
  b.onclick = () => { p.pause(); p.seek(i); };
  segs.append(b);
});
button.onclick = () => (p.playing ? p.pause() : p.play());
if (!matchMedia("(prefers-reduced-motion: reduce)").matches) p.play();
</script>
</body>
</html>
