<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sequence playback prototype</title>
<style>
:root{color-scheme:light dark;--page:#f6f7f9;--card:#ffffff;--fg:#17202c;--mute:#5a6575;--rail:#d3d9e2;--accent:#0a7a60}
@media (prefers-color-scheme:dark){:root{--page:#11151b;--card:#171c24;--fg:#e5e9ef;--mute:#98a2b0;--rail:#2c3440;--accent:#6ff0cf}}
body{margin:0;background:var(--page);color:var(--fg);font:14px/1.5 system-ui,sans-serif}
main{max-width:1120px;margin:0 auto;padding:24px 16px 48px}
h1{font-size:18px;margin:0 0 4px}
p.lead{margin:0 0 16px;color:var(--mute)}
.variants{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 6px}
.variants button{font:12px/1 ui-monospace,monospace;color:var(--fg);background:var(--card);border:1px solid var(--rail);border-radius:999px;height:30px;padding:0 12px;cursor:pointer}
.variants button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.explain{min-height:42px;margin:0 0 14px;color:var(--mute);font-size:13px}
.figure{background:var(--card);border:1px solid var(--rail);border-radius:12px;overflow:clip}
.figure .ab-playback{background:none}
.steps{list-style:none;margin:0;padding:8px 12px 12px;display:grid;gap:2px}
.steps li{display:grid;grid-template-columns:28px minmax(0,1fr);column-gap:10px;padding:5px 8px;border-radius:8px;cursor:pointer;color:color-mix(in srgb,var(--mute) 70%,var(--card));transition:background .3s,color .3s}
.steps li:hover{background:color-mix(in srgb,var(--rail) 40%,transparent)}
.steps .n{grid-row:1/3;font:500 11px/20px ui-monospace,monospace}
.steps .who{font:12px/20px ui-monospace,monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.steps .cap{font-size:14px;line-height:1.4}
.steps li.played{color:var(--fg)}
.steps li.played .who{color:var(--mute)}
.steps li.current{background:color-mix(in srgb,var(--accent) 10%,transparent);color:var(--fg)}
.steps li.current .n,.steps li.current .who{color:var(--accent)}
.steps li.current .cap{font-weight:600}
@media (min-width:1000px){
.figure{display:grid;grid-template-columns:auto minmax(300px,1fr);align-items:start}
.figure .scroll{padding:12px 8px;border-right:1px solid var(--rail)}
.figure .ab-playback{position:sticky;top:0;max-height:100vh;overflow-y:auto;padding-bottom:4px}
.figure .ab-playback .abp-step{display:none}
.figure .ab-playback .abp-actions{padding-top:12px}
}
.scroll{overflow-x:auto;padding:12px 8px 0}
.figure svg{display:block;margin:0 auto}
</style>
</head>
<body>
<main>
<h1>Sequence playback, prototype</h1>
<p class="lead">The claim example from the site, played with the 0.3.0 player and controls. A step names a message by its number. Pick a treatment, then press Play. On wide screens the captions sit in a column beside the diagram; click a step to jump to it.</p>
<div class="variants" role="group" aria-label="Treatment">
<button type="button" data-v="v-flow">A · same as flows</button>
<button type="button" data-v="v-packet">B · message travels</button>
<button type="button" data-v="v-cursor">C · travels + time cursor</button>
</div>
<p class="explain" id="explain"></p>
<div class="figure" id="figure">
<div class="scroll">
<svg xmlns="http://www.w3.org/2000/svg" class="ab ab-auto v-cursor" data-ab-play="ab" viewBox="0 0 678 744" width="678" height="744" role="img" aria-label="Sequence: Creator, Studio, Backend, RSS feed, Owner's inbox. Creator to Studio: Sign in, no show yet. Studio to Creator: Claim existing, Add via RSS, Start from scratch. Creator to Studio: Claim existing show. Studio to Backend: POST claim for show. Backend to RSS feed: Fetch feed live. RSS feed to Backend: itunes owner email. Backend to Owner's inbox: Send 6-digit code. Owner's inbox to Creator: Email with the code. Creator to Studio: Enter code. Studio to Backend: POST verify code. Backend to Backend: Check code and expiry. Backend to Studio: Claim confirmed. Studio to Creator: The show is yours. Backend to Studio: Rejected, attempts left. Studio to Creator: Try again or resend the code">

<style id="seq-play">
.ab.ab-auto{--play:var(--ab-play,#0a7a60)}
@media (prefers-color-scheme:dark){.ab.ab-auto{--play:var(--ab-play,#6ff0cf)}}
.ab [data-ab-part]{color:var(--play);transition:opacity .35s ease}
.ab [data-ab-part] .e-system{color:var(--system)}
.ab [data-ab-part] .e-ink{color:var(--ink)}
/* Unplayed messages and not-yet-involved participants fade, as in flows. */
.ab.ab-in-progress [data-ab-part]:not(.ab-current):not(.ab-played){opacity:.28}

/** Play resolved parts on one inline SVG. Nothing starts until play() is called. */
function createPlayer(
	svg               ,
	timelines            ,
	options                                                              = {},
)         {
	let state              = Object.freeze({ scenario: 0, step: -1, status: "idle" });
	let destroyed = false;
	let timer                                           ;
	let preference                            ;
	const steps = () => timelines[state.scenario]?.steps ?? [];

	function paint() {
		svg.classList.toggle("ab-playing", state.status === "playing");
		svg.classList.toggle("ab-in-progress", state.step >= 0);
		const current = new Set(steps()[state.step]?.parts);
		const played = new Set(steps().slice(0, Math.max(0, state.step)).flatMap(step => step.parts));
		for (const wrapper of svg.querySelectorAll("[data-ab-part]")) {
			const part = wrapper.getAttribute("data-ab-part") ?? "";
			wrapper.classList.toggle("ab-current", current.has(part));
			wrapper.classList.toggle("ab-played", !current.has(part) && played.has(part));
		}
	}

	function unobserve() {
		preference?.removeEventListener("change", motionChanged);
		preference = undefined;
	}

	function cancel() {
		clearTimeout(timer);
		timer = undefined;
		unobserve();
	}

	function change(scenario        , step        , status                       ) {
		const changed = state.scenario !== scenario || state.step !== step || state.status !== status;
		if (changed) {
			state = Object.freeze({ scenario, step, status });
			paint();
		}
		// Arm before notifying so a callback can pause, navigate or destroy safely.
		if (status === "playing") timer = setTimeout(advance, steps()[step].ms);
		if (changed) options.onChange?.(state);
	}

	function advance() {
		timer = undefined;
		if (destroyed || state.status !== "playing") return;
		if (state.step < steps().length - 1) change(state.scenario, state.step + 1, "playing");
		else if (options.loop) change(state.scenario, 0, "playing");
		else {
			unobserve();
			change(state.scenario, state.step, "ended");
		}
	}

	function reset() {
		cancel();
		change(state.scenario, -1, "idle");
	}

	function motionChanged(event                     ) {
		if (!destroyed && state.status === "playing" && event.matches) reset();
	}

	function seek(step        ) {
		if (destroyed || !Number.isInteger(step)) return;
		cancel();
		change(state.scenario, Math.max(-1, Math.min(step, steps().length - 1)), "paused");
	}

	paint();
	return {
		get state() { return state; },
		play() {
			if (destroyed) return;
			const view = svg.ownerDocument.defaultView;
			const media = view?.matchMedia?.("(prefers-reduced-motion: reduce)");
			if (media?.matches || !steps().length) {
				reset();
				return;
			}
			if (state.status === "playing") return;
			cancel();
			preference = media;
			preference?.addEventListener("change", motionChanged);
			const step = state.status === "paused" && state.step >= 0 ? state.step : 0;
			change(state.scenario, step, "playing");
		},
		pause() {
			if (destroyed || state.status !== "playing") return;
			cancel();
			change(state.scenario, state.step, "paused");
		},
		next() { seek(state.step + 1); },
		previous() { seek(state.step - 1); },
		seek,
		select(scenario) {
			if (destroyed || !Number.isInteger(scenario) || scenario < 0 || scenario >= timelines.length) return;
			cancel();
			change(scenario, timelines[scenario].steps.length ? 0 : -1, "paused");
		},
		destroy() {
			if (destroyed) return;
			destroyed = true;
			cancel();
			state = Object.freeze({ scenario: state.scenario, step: -1, status: "idle" });
			paint();
		},
	};
}

		if (announced !== position) {

	};

		}, { threshold: 0.5 });
		observer.observe(svg);
		removers.push(() => observer.disconnect());
	}

			li.addEventListener("click", () => mount.player.seek(i));
			return li;
		}));
	}
	list.querySelectorAll("li").forEach((li, i) => {
		li.classList.toggle("current", i === step);
		li.classList.toggle("played", i < step);
		if (i === step) li.setAttribute("aria-current", "step"); else li.removeAttribute("aria-current");
	});
}
new MutationObserver(syncList).observe(svg, { attributes: true, attributeFilter: ["class"], subtree: true });
syncList();
</script>
</body>
