<text x="0" y="84" class="m s11 muted seq-number">01</text>
<path d="M88,80 L219,80" class="e e-ink" marker-end="url(#claim-seq-ink)"/>
<circle cx="88" cy="80" r="2.5" class="t-ink"/>
</g>
<g data-line="9" data-step="2">
<text x="96" y="118" class="m s12 seq-label">Claim existing, Add via RSS, Start from scratch</text>
<text x="0" y="136" class="m s11 muted seq-number">02</text>
<path d="M219,132 L88,132" class="e e-muted dash seq-response" marker-end="url(#claim-seq-response)"/>
</g>
<g data-line="10" data-step="3">
<text x="96" y="170" class="m s12 seq-label">Claim existing show</text>
<text x="0" y="188" class="m s11 muted seq-number">03</text>
<path d="M88,184 L219,184" class="e e-ink" marker-end="url(#claim-seq-ink)"/>
<circle cx="88" cy="184" r="2.5" class="t-ink"/>
</g>
<g data-line="11" data-step="4">
<text x="227" y="222" class="m s12 seq-label">POST claim for show</text>
<text x="0" y="240" class="m s11 muted seq-number">04</text>
<path d="M219,236 L350,236" class="e e-system" marker-end="url(#claim-seq-system)"/>
<circle cx="219" cy="236" r="2.5" class="t-system"/>
</g>
<g data-line="12" data-step="5">
