<text x="0" y="500" class="m s11 muted seq-number">09</text>
<path d="M88,496 L219,496" class="e e-ink" marker-end="url(#claim-seq-ink)"/>
<circle cx="88" cy="496" r="2.5" class="t-ink"/>
</g>
<g data-line="18" data-step="10">
<text x="227" y="534" class="m s12 seq-label">POST verify code</text>
<text x="0" y="552" class="m s11 muted seq-number">10</text>
<path d="M219,548 L350,548" class="e e-system" marker-end="url(#claim-seq-system)"/>
<circle cx="219" cy="548" r="2.5" class="t-system"/>
</g>
<g data-line="19" data-step="11">
<text x="382" y="586" class="m s12 seq-label">Check code and expiry</text>
<text x="0" y="604" class="m s11 muted seq-number">11</text>
<path d="M350,600 H369 Q374,600 374,605 V617 Q374,622 369,622 H350" class="e e-system" marker-end="url(#claim-seq-system)"/>
<circle cx="350" cy="600" r="2.5" class="t-system"/>
</g>
<g data-line="21" data-step="12">
<text x="227" y="660" class="m s12 seq-label">Claim confirmed</text>
<text x="0" y="678" class="m s11 muted seq-number">12</text>
<path d="M350,674 L219,674" class="e e-muted dash seq-response" marker-end="url(#claim-seq-response)"/>
</g>
<g data-line="22" data-step="13">
<text x="96" y="712" class="m s12 seq-label">The show is yours</text>
<text x="0" y="730" class="m s11 muted seq-number">13</text>
<path d="M219,726 L88,726" class="e e-muted dash seq-response" marker-end="url(#claim-seq-response)"/>
</g>
<g data-line="23" data-step="14">
<text x="227" y="764" class="m s12 seq-label">Rejected, attempts left</text>
<text x="0" y="782" class="m s11 muted seq-number">14</text>
<path d="M350,778 L219,778" class="e e-muted dash seq-response" marker-end="url(#claim-seq-response)"/>
</g>
<g data-line="24" data-step="15">
<text x="96" y="816" class="m s12 seq-label">Try again or resend the code</text>
<text x="0" y="834" class="m s11 muted seq-number">15</text>
<path d="M219,830 L88,830" class="e e-muted dash seq-response" marker-end="url(#claim-seq-response)"/>
</g>
</svg>
