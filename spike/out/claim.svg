<text x="0" y="292" class="m s11 muted seq-number">05</text>
<path d="M350,288 L481,288" class="e e-system" marker-end="url(#claim-seq-system)"/>
<circle cx="350" cy="288" r="2.5" class="t-system"/>
</g>
<g data-line="13" data-step="6">
<text x="358" y="326" class="m s12 seq-label">itunes owner email</text>
