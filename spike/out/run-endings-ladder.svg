<svg xmlns="http://www.w3.org/2000/svg" class="ab ab-auto" viewBox="0 0 678 302" width="678" height="302" role="img" aria-label="Fan-out: Record how the run ended. Success: The work and required checks finished; destination: Hand off for review. Blocked: A person must resolve a decision or missing access; destination: Ask a maintainer. Crash: The process ended before it could report; destination: Retry the run. Retries exhausted: The run used every permitted retry; destination: Ask a maintainer">
<style>.ab.ab-auto{--bg:var(--ab-bg,#ffffff);--ink:var(--ab-ink,#17202c);--muted:var(--ab-muted,#5a6575);--line:var(--ab-line,#d3d9e2);--band:var(--ab-band,#e9eef5);--surface:var(--ab-surface,#ffffff);--neutral:var(--ab-neutral,#59616c);--neutral-bg:var(--ab-neutral-bg,#e1e3e6);--agent:var(--ab-agent,#3f6562);--agent-bg:var(--ab-agent-bg,#e6efed);--system:var(--ab-system,#465b83);--system-bg:var(--ab-system-bg,#eaedf4);--rework:var(--ab-rework,#8c6544);--rework-bg:var(--ab-rework-bg,#f6f0e6);--stop:var(--ab-stop,#925149);--stop-bg:var(--ab-stop-bg,#f1e5e3);--done:var(--ab-done,#4c7155);--done-bg:var(--ab-done-bg,#e6eee8);}@media (prefers-color-scheme:dark){.ab.ab-auto{--bg:var(--ab-bg,#171c24);--ink:var(--ab-ink,#e5e9ef);--muted:var(--ab-muted,#98a2b0);--line:var(--ab-line,#2c3440);--band:var(--ab-band,#151b23);--surface:var(--ab-surface,#1d232d);--neutral:var(--ab-neutral,#b6bbc3);--neutral-bg:var(--ab-neutral-bg,#303640);--agent:var(--ab-agent,#80b3ad);--agent-bg:var(--ab-agent-bg,#202d2c);--system:var(--ab-system,#98acd2);--system-bg:var(--ab-system-bg,#232a38);--rework:var(--ab-rework,#c4a078);--rework-bg:var(--ab-rework-bg,#2d271d);--stop:var(--ab-stop,#c68981);--stop-bg:var(--ab-stop-bg,#301f1d);--done:var(--ab-done,#8cbb9a);--done-bg:var(--ab-done-bg,#1f2b22);}}
.ab text{font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;fill:var(--ink)}
.ab .m{font-family:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace}
.ab .s11{font-size:11px}.ab .s12{font-size:12px}.ab .s13{font-size:13px}
.ab .muted{fill:var(--muted)}.ab .b{font-weight:600}
.ab .cap{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;font-size:11px;letter-spacing:.08em;fill:var(--muted)}
.ab .band{fill:var(--band)}.ab .rule{stroke:var(--line);stroke-width:1.2;stroke-dasharray:3 5}
.ab .pill{fill:var(--surface);stroke:var(--line);stroke-width:1.2}
.ab .e{fill:none;stroke-width:1.6}.ab .dash{stroke-dasharray:6 5}
.ab .knockout{fill:none;stroke:var(--bg);stroke-width:5.6}.ab .knockout-band{stroke:var(--band)}
.ab .arrow{fill:none;stroke:none}
.ab .t-ink{fill:var(--muted)}.ab .e-ink{stroke:var(--muted)}.ab .k-ink{fill:var(--surface);stroke:var(--line);stroke-width:1.5}.ab .t-muted{fill:var(--muted)}.ab .e-muted{stroke:var(--muted)}.ab .k-muted{fill:var(--surface);stroke:var(--line);stroke-width:1.5}.ab .t-neutral{fill:var(--neutral)}.ab .e-neutral{stroke:var(--neutral)}.ab .k-neutral{fill:var(--neutral-bg);stroke:var(--neutral);stroke-width:1.5}.ab .t-agent{fill:var(--agent)}.ab .e-agent{stroke:var(--agent)}.ab .k-agent{fill:var(--agent-bg);stroke:var(--agent);stroke-width:1.5}.ab .t-system{fill:var(--system)}.ab .e-system{stroke:var(--system)}.ab .k-system{fill:var(--system-bg);stroke:var(--system);stroke-width:1.5}.ab .t-done{fill:var(--done)}.ab .e-done{stroke:var(--done)}.ab .k-done{fill:var(--done-bg);stroke:var(--done);stroke-width:1.5}.ab .t-rework{fill:var(--rework)}.ab .e-rework{stroke:var(--rework)}.ab .k-rework{fill:var(--rework-bg);stroke:var(--rework);stroke-width:1.5}.ab .t-stop{fill:var(--stop)}.ab .e-stop{stroke:var(--stop)}.ab .k-stop{fill:var(--stop-bg);stroke:var(--stop);stroke-width:1.5}
.ab .k-stop.panel{stroke-width:1.2;stroke-dasharray:5 4}</style>
<rect x="16" y="16" width="219.2" height="42" rx="8" class="k-agent"/>
<text x="32" y="42" class="m s13 b t-agent">Record how the run ended</text>
<path d="M40,58 L40,258" class="e e-ink"/>
<g data-line="5">
<circle cx="40" cy="84" r="6" class="t-done"/>
<text x="60" y="88" class="m s12 b">Success</text>
<text x="662" y="88" text-anchor="end" class="m s12 b">Hand off for review</text>
<line x1="122.4" y1="84" x2="513.2" y2="84" class="rule"/>
<text x="60" y="106" class="m s12 muted">The work and required checks finished</text>
</g>
<g data-line="6">
<circle cx="40" cy="142" r="6" class="t-stop"/>
<text x="60" y="146" class="m s12 b">Blocked</text>
<text x="662" y="146" text-anchor="end" class="m s12 b">Ask a maintainer</text>
<line x1="122.4" y1="142" x2="534.8" y2="142" class="rule"/>
<text x="60" y="164" class="m s12 muted">A person must resolve a decision or missing access</text>
</g>
<g data-line="7">
<circle cx="40" cy="200" r="6" class="t-rework"/>
<text x="60" y="204" class="m s12 b">Crash</text>
<text x="662" y="204" text-anchor="end" class="m s12 b">Retry the run</text>
<line x1="108" y1="200" x2="556.4" y2="200" class="rule"/>
<text x="60" y="222" class="m s12 muted">The process ended before it could report</text>
</g>
<g data-line="8">
<circle cx="40" cy="258" r="6" class="t-stop"/>
<text x="60" y="262" class="m s12 b">Retries exhausted</text>
<text x="662" y="262" text-anchor="end" class="m s12 b">Ask a maintainer</text>
<line x1="194.4" y1="258" x2="534.8" y2="258" class="rule"/>
<text x="60" y="280" class="m s12 muted">The run used every permitted retry</text>
</g>
</svg>
