<text x="42" y="188" class="m s12">card declined</text></g>
<g><rect x="465" y="156" width="229" height="56" rx="10" class="k-stop panel"/>
<text x="580" y="181" text-anchor="middle" class="s12 b">Fraud review</text>
<text x="580" y="199" text-anchor="middle" class="s11 muted">an analyst checks risky orders</text></g>
<text x="320" y="69" class="m s11">check out</text>
