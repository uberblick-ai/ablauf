<svg xmlns="http://www.w3.org/2000/svg" class="ab ab-auto" viewBox="0 0 678 362" width="678" height="362" role="img" aria-label="Fan-out: Record how the run ended. Success: The work and required checks finished; destination: Hand off for review. Blocked: A person must resolve a decision or missing access; destination: Ask a maintainer. Crash: The process ended before it could report; destination: Retry the run. Retries exhausted: The run used every permitted retry; destination: Ask a maintainer">
<style>.ab.ab-auto{--ink:var(--ab-ink,#17202c);--muted:var(--ab-muted,#5a6575);--line:var(--ab-line,#d3d9e2);--band:var(--ab-band,#e9eef5);--surface:var(--ab-surface,#ffffff);--neutral:var(--ab-neutral,#59616c);--neutral-bg:var(--ab-neutral-bg,#e1e3e6);--agent:var(--ab-agent,#0b6b67);--agent-bg:var(--ab-agent-bg,#dff1ee);--system:var(--ab-system,#3459a3);--system-bg:var(--ab-system-bg,#e7edfb);--rework:var(--ab-rework,#a65f0c);--rework-bg:var(--ab-rework-bg,#fbefdc);--stop:var(--ab-stop,#b2382f);--stop-bg:var(--ab-stop-bg,#f9e2df);--done:var(--ab-done,#2a7845);--done-bg:var(--ab-done-bg,#e0f1e5);}@media (prefers-color-scheme:dark){.ab.ab-auto{--ink:var(--ab-ink,#e5e9ef);--muted:var(--ab-muted,#98a2b0);--line:var(--ab-line,#2c3440);--band:var(--ab-band,#151b23);--surface:var(--ab-surface,#1d232d);--neutral:var(--ab-neutral,#b6bbc3);--neutral-bg:var(--ab-neutral-bg,#303640);--agent:var(--ab-agent,#5cc5bb);--agent-bg:var(--ab-agent-bg,#12302d);--system:var(--ab-system,#91b4fa);--system-bg:var(--ab-system-bg,#1c2945);--rework:var(--ab-rework,#e3a250);--rework-bg:var(--ab-rework-bg,#33250f);--stop:var(--ab-stop,#ef7f73);--stop-bg:var(--ab-stop-bg,#3a1916);--done:var(--ab-done,#72cf91);--done-bg:var(--ab-done-bg,#142e1d);}}
.ab text{font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;fill:var(--ink)}
.ab .m{font-family:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace}
.ab .s11{font-size:11px}.ab .s12{font-size:12px}.ab .s13{font-size:13px}
.ab .muted{fill:var(--muted)}.ab .b{font-weight:600}
.ab .cap{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;font-size:11px;letter-spacing:.08em;fill:var(--muted)}
.ab .band{fill:var(--band)}.ab .rule{stroke:var(--line);stroke-width:1.2;stroke-dasharray:3 5}
.ab .pill{fill:var(--surface);stroke:var(--line);stroke-width:1.2}
.ab .e{fill:none;stroke-width:1.6}.ab .dash{stroke-dasharray:6 5}
.ab .t-ink{fill:var(--muted)}.ab .e-ink{stroke:var(--muted)}.ab .k-ink{fill:var(--surface);stroke:var(--line);stroke-width:1.5}.ab .t-muted{fill:var(--muted)}.ab .e-muted{stroke:var(--muted)}.ab .k-muted{fill:var(--surface);stroke:var(--line);stroke-width:1.5}.ab .t-neutral{fill:var(--neutral)}.ab .e-neutral{stroke:var(--neutral)}.ab .k-neutral{fill:var(--neutral-bg);stroke:var(--neutral);stroke-width:1.5}.ab .t-agent{fill:var(--agent)}.ab .e-agent{stroke:var(--agent)}.ab .k-agent{fill:var(--agent-bg);stroke:var(--agent);stroke-width:1.5}.ab .t-system{fill:var(--system)}.ab .e-system{stroke:var(--system)}.ab .k-system{fill:var(--system-bg);stroke:var(--system);stroke-width:1.5}.ab .t-done{fill:var(--done)}.ab .e-done{stroke:var(--done)}.ab .k-done{fill:var(--done-bg);stroke:var(--done);stroke-width:1.5}.ab .t-rework{fill:var(--rework)}.ab .e-rework{stroke:var(--rework)}.ab .k-rework{fill:var(--rework-bg);stroke:var(--rework);stroke-width:1.5}.ab .t-stop{fill:var(--stop)}.ab .e-stop{stroke:var(--stop)}.ab .k-stop{fill:var(--stop-bg);stroke:var(--stop);stroke-width:1.5}
.ab .k-stop.panel{stroke-width:1.2;stroke-dasharray:5 4}</style>
<defs><marker id="run-endings-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" class="t-ink"/></marker></defs>
<rect x="16" y="132" width="176" height="80" rx="8" class="k-agent"/>
<text x="32" y="154" class="cap">STEP</text>
<text x="32" y="176" class="m s13 b t-agent">Record how the run</text>
<text x="32" y="194" class="m s13 b t-agent">ended</text>
<path d="M192,172 L216,172" class="e e-ink"/>
<path d="M216,40 L216,304" class="e e-ink"/>
<g data-line="4">
<path d="M216,40 L476,40" class="e e-ink" marker-end="url(#run-endings-ink)"/>
<text x="232" y="30" class="m s12 b">Success</text>
<text x="232" y="60" class="m s12 muted">The work and required checks</text>
<text x="232" y="78" class="m s12 muted">finished</text>
<rect x="478" y="23" width="184" height="34" rx="8" class="pill"/>
<text x="494" y="44" class="m s12 b">Hand off for review</text>
</g>
<g data-line="5">
<path d="M216,128 L476,128" class="e e-ink" marker-end="url(#run-endings-ink)"/>
<text x="232" y="118" class="m s12 b">Blocked</text>
<text x="232" y="148" class="m s12 muted">A person must resolve a</text>
<text x="232" y="166" class="m s12 muted">decision or missing access</text>
<rect x="478" y="111" width="184" height="34" rx="8" class="pill"/>
<text x="494" y="132" class="m s12 b">Ask a maintainer</text>
</g>
<g data-line="6">
<path d="M216,216 L476,216" class="e e-ink" marker-end="url(#run-endings-ink)"/>
<text x="232" y="206" class="m s12 b">Crash</text>
<text x="232" y="236" class="m s12 muted">The process ended before it</text>
<text x="232" y="254" class="m s12 muted">could report</text>
<rect x="478" y="199" width="184" height="34" rx="8" class="pill"/>
<text x="494" y="220" class="m s12 b">Retry the run</text>
</g>
<g data-line="7">
<path d="M216,304 L476,304" class="e e-ink" marker-end="url(#run-endings-ink)"/>
<text x="232" y="294" class="m s12 b">Retries exhausted</text>
<text x="232" y="324" class="m s12 muted">The run used every permitted</text>
<text x="232" y="342" class="m s12 muted">retry</text>
<rect x="478" y="287" width="184" height="34" rx="8" class="pill"/>
<text x="494" y="308" class="m s12 b">Ask a maintainer</text>
</g>
</svg>
