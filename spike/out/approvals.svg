<svg xmlns="http://www.w3.org/2000/svg" class="ab ab-auto" viewBox="0 0 678 251" width="678" height="251" role="img" aria-label="Fan-out: Check whether approval permits the run. Approved: A maintainer started it and the input is unchanged; destination: Start the run. Outside input: The input has not been cleared by a maintainer; destination: Ask a maintainer. Edited since: The input changed after the maintainer started it; destination: Ask a maintainer">
<style>.ab.ab-auto{--bg:var(--ab-bg,#ffffff);--ink:var(--ab-ink,#17202c);--muted:var(--ab-muted,#5a6575);--line:var(--ab-line,#d3d9e2);--band:var(--ab-band,#e9eef5);--surface:var(--ab-surface,#ffffff);--neutral:var(--ab-neutral,#59616c);--neutral-bg:var(--ab-neutral-bg,#e1e3e6);--agent:var(--ab-agent,#3e6563);--agent-bg:var(--ab-agent-bg,#e7eeed);--system:var(--ab-system,#4f5d76);--system-bg:var(--ab-system-bg,#ebedf3);--rework:var(--ab-rework,#826954);--rework-bg:var(--ab-rework-bg,#f3f0eb);--stop:var(--ab-stop,#815f5a);--stop-bg:var(--ab-stop-bg,#ede6e5);--done:var(--ab-done,#536e5a);--done-bg:var(--ab-done-bg,#e8ede9);}@media (prefers-color-scheme:dark){.ab.ab-auto{--bg:var(--ab-bg,#171c24);--ink:var(--ab-ink,#e5e9ef);--muted:var(--ab-muted,#98a2b0);--line:var(--ab-line,#2c3440);--band:var(--ab-band,#151b23);--surface:var(--ab-surface,#1d232d);--neutral:var(--ab-neutral,#b6bbc3);--neutral-bg:var(--ab-neutral-bg,#303640);--agent:var(--ab-agent,#85aaa5);--agent-bg:var(--ab-agent-bg,#232d2b);--system:var(--ab-system,#98a5bf);--system-bg:var(--ab-system-bg,#262a31);--rework:var(--ab-rework,#b29d87);--rework-bg:var(--ab-rework-bg,#2c2720);--stop:var(--ab-stop,#ac8c88);--stop-bg:var(--ab-stop-bg,#2b2221);--done:var(--ab-done,#95b09c);--done-bg:var(--ab-done-bg,#222a24);}}
.ab text{font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;fill:var(--ink)}
.ab .m{font-family:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace}
.ab .s11{font-size:11px}.ab .s12{font-size:12px}.ab .s13{font-size:13px}
.ab .muted{fill:var(--muted)}.ab .b{font-weight:600}
.ab .cap{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;font-size:11px;letter-spacing:.08em;fill:var(--muted)}
.ab .band{fill:var(--band)}.ab .rule{stroke:var(--line);stroke-width:1.2;stroke-dasharray:3 5}
.ab .pill{fill:var(--surface);stroke:var(--line);stroke-width:1.2}
.ab .e{fill:none;stroke-width:1.6}.ab .dash{stroke-dasharray:6 5}
.ab .knockout{fill:none;stroke:var(--bg);stroke-width:5.6}.ab .knockout-band{stroke:var(--band)}
.ab .arrow{fill:none;stroke:none}
.ab .t-ink{fill:var(--muted)}.ab .e-ink{stroke:var(--muted)}.ab .k-ink{fill:var(--surface);stroke:var(--line);stroke-width:1.5}.ab .t-muted{fill:var(--muted)}.ab .e-muted{stroke:var(--muted)}.ab .k-muted{fill:var(--surface);stroke:var(--line);stroke-width:1.5}.ab .t-neutral{fill:var(--neutral)}.ab .e-neutral{stroke:var(--neutral)}.ab .k-neutral{fill:var(--neutral-bg);stroke:var(--neutral);stroke-width:1.5}.ab .t-agent{fill:var(--agent)}.ab .e-agent{stroke:var(--agent)}.ab .k-agent{fill:var(--agent-bg);stroke:var(--agent);stroke-width:1.5}.ab .t-system{fill:var(--system)}.ab .e-system{stroke:var(--system)}.ab .k-system{fill:var(--system-bg);stroke:var(--system);stroke-width:1.5}.ab .t-done{fill:var(--done)}.ab .e-done{stroke:var(--done)}.ab .k-done{fill:var(--done-bg);stroke:var(--done);stroke-width:1.5}.ab .t-rework{fill:var(--rework)}.ab .e-rework{stroke:var(--rework)}.ab .k-rework{fill:var(--rework-bg);stroke:var(--rework);stroke-width:1.5}.ab .t-stop{fill:var(--stop)}.ab .e-stop{stroke:var(--stop)}.ab .k-stop{fill:var(--stop-bg);stroke:var(--stop);stroke-width:1.5}
.ab .k-stop.panel{stroke-width:1.2;stroke-dasharray:5 4}</style>
<defs><marker id="approvals-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" class="t-ink"/></marker></defs>
<rect x="16" y="86.5" width="150" height="78" rx="8" class="k-agent"/>
<text x="32" y="112.5" class="m s13 b t-agent">Check whether</text>
<text x="32" y="130.5" class="m s13 b t-agent">approval</text>
<text x="32" y="148.5" class="m s13 b t-agent">permits the run</text>
<g data-line="4">
<path d="M166,125.5 C183,125.5 183,33 200,33 L214,33" class="e e-ink" marker-end="url(#approvals-ink)"/>
<rect x="216" y="16" width="170" height="34" rx="8" class="k-done"/>
<text x="230" y="38" class="m s12 b">Approved</text>
<path d="M386,33 L414,33" class="e e-ink" marker-end="url(#approvals-ink)"/>
<text x="426" y="37" class="m s12 b">Start the run</text>
<text x="426" y="55" class="m s12 muted">A maintainer started it and the</text>
<text x="426" y="73" class="m s12 muted">input is unchanged</text>
</g>
<g data-line="5">
<path d="M166,125.5 C183,125.5 183,112 200,112 L214,112" class="e e-ink" marker-end="url(#approvals-ink)"/>
<rect x="216" y="95" width="170" height="34" rx="8" class="k-stop panel"/>
<text x="230" y="117" class="m s12 b">Outside input</text>
<path d="M386,112 L414,112" class="e e-ink" marker-end="url(#approvals-ink)"/>
<text x="426" y="116" class="m s12 b">Ask a maintainer</text>
<text x="426" y="134" class="m s12 muted">The input has not been cleared</text>
<text x="426" y="152" class="m s12 muted">by a maintainer</text>
</g>
<g data-line="6">
<path d="M166,125.5 C183,125.5 183,191 200,191 L214,191" class="e e-ink" marker-end="url(#approvals-ink)"/>
<rect x="216" y="174" width="170" height="34" rx="8" class="k-stop panel"/>
<text x="230" y="196" class="m s12 b">Edited since</text>
<path d="M386,191 L414,191" class="e e-ink" marker-end="url(#approvals-ink)"/>
<text x="426" y="195" class="m s12 b">Ask a maintainer</text>
<text x="426" y="213" class="m s12 muted">The input changed after the</text>
<text x="426" y="231" class="m s12 muted">maintainer started it</text>
</g>
</svg>
