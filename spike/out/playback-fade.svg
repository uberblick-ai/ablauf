.ab.ab-auto{--play:var(--ab-play,#0a7a60);}@media (prefers-color-scheme:dark){.ab.ab-auto{--play:var(--ab-play,#6ff0cf);}}.ab[data-ab-play="playback-fade"].ab-in-progress [data-ab-part]:not(.ab-current):not(.ab-played):not(:has(.gap)){opacity:.3}.ab[data-ab-play="playback-fade"].ab-in-progress [data-ab-part]:not(.ab-current):not(.ab-played):has(.gap) text{opacity:.3}
.ab[data-ab-play="playback-fade"] [data-ab-part]{color:var(--play)}.ab[data-ab-play="playback-fade"] [data-ab-part]:has(circle.t-agent){color:var(--agent)}.ab[data-ab-play="playback-fade"] [data-ab-part]:has(circle.t-system){color:var(--system)}.ab[data-ab-play="playback-fade"] [data-ab-part]:has(circle.t-done){color:var(--done)}.ab[data-ab-play="playback-fade"] [data-ab-part]:has(circle.t-rework){color:var(--rework)}.ab[data-ab-play="playback-fade"] [data-ab-part]:has(circle.t-stop){color:var(--stop)}.ab[data-ab-play="playback-fade"] :is(.k-agent,.e-agent){color:var(--agent)}.ab[data-ab-play="playback-fade"] :is(.k-system,.e-system){color:var(--system)}.ab[data-ab-play="playback-fade"] :is(.k-done,.e-done){color:var(--done)}.ab[data-ab-play="playback-fade"] :is(.k-rework,.e-rework){color:var(--rework)}.ab[data-ab-play="playback-fade"] :is(.k-stop,.e-stop){color:var(--stop)}.ab[data-ab-play="playback-fade"] [data-ab-part].ab-current :is(rect:not(.gap),.decision,.e){filter:drop-shadow(0 0 var(--ab-play-glow,6px) color-mix(in srgb,currentColor 55%,transparent));stroke-width:2.2}.ab[data-ab-play="playback-fade"].ab-playing [data-ab-part].ab-current .e{stroke-dasharray:8 6;animation:ab-run-70-6c-61-79-62-61-63-6b-2d-66-61-64-65 .7s linear infinite}@keyframes ab-run-70-6c-61-79-62-61-63-6b-2d-66-61-64-65{from{stroke-dashoffset:0}to{stroke-dashoffset:-14}}.ab[data-ab-play="playback-fade"].ab-playing [data-ab-part]:not(:has(.gap)),.ab[data-ab-play="playback-fade"].ab-playing [data-ab-part] text{transition:opacity .35s ease}@media (prefers-reduced-motion:reduce){.ab[data-ab-play="playback-fade"].ab-playing [data-ab-part].ab-current .e{animation:none}.ab[data-ab-play="playback-fade"].ab-playing [data-ab-part]:not(:has(.gap)),.ab[data-ab-play="playback-fade"].ab-playing [data-ab-part] text{transition:none}}</style>
