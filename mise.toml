# A fresh checkout or worktree: `mise trust && mise run setup`.
[tools]
node = "26"
pnpm = "10"

# The quick-start, once per checkout entry. `enter` fires only in a shell with
# `mise activate`; the script decides whether to say anything at all.
[hooks]
enter = { run = 'sh "{{config_root}}/bin/mise-welcome.sh"' }

[tasks.welcome]
description = "Show the quick-start"
quiet = true
run = 'sh "{{config_root}}/bin/mise-welcome.sh"'

[tasks.setup]
description = "Install the pinned toolchain and frozen dependencies"
# PNPM_STORE_DIR is set by CI to the store it caches; unset locally.
run = 'pnpm install --frozen-lockfile --silent ${PNPM_STORE_DIR:+--store-dir "$PNPM_STORE_DIR"}'

[tasks.lint]
description = "Lint with Biome"
run = "pnpm -s lint"

[tasks.typecheck]
description = "Typecheck with tsc"
run = "pnpm -s typecheck"

[tasks.test]
description = "Run the renderer tests"
run = "pnpm -s test"

[tasks.ci]
description = "Lint, typecheck and tests, before you push"
depends = ["setup"]
run = ["pnpm -s lint", "pnpm -s typecheck", "pnpm -s test"]

[tasks.playground]
description = "Serve the review page on localhost:4620 (or a free port)"
depends = ["setup"]
run = "pnpm -s playground"

[tasks.check]
description = "Render one .flow file next to itself and list its problems"
usage = 'arg "<file>" help="Path to a .flow file"'
run = 'node spike/check.ts "${usage_file?}"'

[tasks.render]
description = "Render every example to spike/out/"
run = "pnpm -s render"

[tasks.measure]
description = "Show what moved between the loop and the loop with a role inserted"
run = "pnpm -s measure"

[tasks.release]
description = "Maintainer only: release an already-prepared X.Y.Z (--check is read-only)"
run = "node spike/release/command.ts"
